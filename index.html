<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>Books Insight Trove</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=Source+Sans+3:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a reading-room ledger. Library shelf → one dashboard per book (overview tiles + tabs) → themes map. Max 1100px, side rail of tabs inside each book. */
:root{
  --bg:#EDEFEA; --paper:#F8F8F5; --ink:#1A2126; --ink-2:#4A555C; --ink-3:#7A858B;
  --line:#D3D7D1; --line-2:#E3E6E1;
  --accent:#2F5D50; --accent-ink:#F8F8F5; --accent-soft:#DCE8E2;
  --claude:#6B4FA3; --claude-soft:#ECE6F6;
  --book:#2F5D50; --book-soft:#DCE8E2;
  --display:"Newsreader",Georgia,"Times New Roman",serif;
  --body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:6px; --shadow:0 1px 2px rgba(20,30,30,.06),0 6px 20px rgba(20,30,30,.05);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141A1C; --paper:#1C2326; --ink:#ECEEEA; --ink-2:#B4BCB8; --ink-3:#7F8A87;
  --line:#2E383B; --line-2:#263033;
  --accent:#7FB7A4; --accent-ink:#0F1A17; --accent-soft:#1F3029;
  --claude:#B9A3E6; --claude-soft:#2A2340;
  --book:#7FB7A4; --book-soft:#1F3029; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141A1C; --paper:#1C2326; --ink:#ECEEEA; --ink-2:#B4BCB8; --ink-3:#7F8A87;
  --line:#2E383B; --line-2:#263033;
  --accent:#7FB7A4; --accent-ink:#0F1A17; --accent-soft:#1F3029;
  --claude:#B9A3E6; --claude-soft:#2A2340;
  --book:#7FB7A4; --book-soft:#1F3029; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;margin:0}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,h4{font-family:var(--display);font-weight:500;line-height:1.15;margin:0;text-wrap:balance}
p{margin:0}
.wrap{max-width:1100px;margin:0 auto;padding-inline:20px;padding-block:0 64px}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.muted{color:var(--ink-2)}
.small{font-size:15px}
.prose{max-width:66ch}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{padding-block:12px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.brand{font-family:var(--display);font-size:22px;font-weight:600;letter-spacing:-.01em;display:flex;align-items:baseline;gap:10px}
.brand small{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:400}
.nav{display:flex;gap:4px;margin-left:auto}
.nav button{padding:6px 12px;border-radius:999px;font-size:15px;font-weight:500;color:var(--ink-2)}
.nav button[aria-current="page"]{background:var(--ink);color:var(--bg)}
.crumb{font-size:14px;color:var(--ink-3);display:flex;gap:8px;align-items:center}
.crumb button{color:var(--accent);font-weight:500;padding:0}

/* library */
.hero{padding-block:44px 28px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:1.4fr 1fr;gap:40px;align-items:end}
.hero h1{font-size:clamp(34px,5vw,54px);font-weight:400;letter-spacing:-.015em}
.hero h1 em{font-style:italic;color:var(--accent)}
.thesis{font-family:var(--display);font-size:19px;line-height:1.45;color:var(--ink-2);border-left:2px solid var(--accent);padding-left:16px;font-style:italic}
.stats{display:flex;gap:28px;flex-wrap:wrap;margin-top:18px}
.stat b{font-family:var(--display);font-size:30px;font-weight:500;display:block;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--ink-3)}
.section{padding-block:32px}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:16px;flex-wrap:wrap}
.section-head h2{font-size:26px}
.needs{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.need{text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:4px;transition:border-color .15s}
.need:hover{border-color:var(--accent)}
.need b{font-weight:600}
.need span{font-size:14px;color:var(--ink-3)}
.need i{font-family:var(--mono);font-style:normal;font-size:12px;color:var(--accent)}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:18px}
.bookcard{text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:grid;grid-template-columns:76px 1fr;box-shadow:var(--shadow);transition:transform .15s,border-color .15s;min-width:0}
.bookcard:hover{transform:translateY(-2px);border-color:var(--book)}
.spine{background:var(--book);color:#fff;writing-mode:vertical-rl;transform:rotate(180deg);font-family:var(--display);font-size:15px;padding:14px 0;display:flex;align-items:center;justify-content:center;text-align:center;letter-spacing:.02em}
.bookcard .body{padding:18px 18px 16px;display:grid;gap:10px;min-width:0;align-content:start}
.bookcard h3{font-size:24px}
.bookcard .by{font-size:14px;color:var(--ink-3)}
.bookcard .ess{font-size:15.5px;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:flex-start;align-content:flex-start}
.chip{font-size:12.5px;line-height:1.4;font-weight:500;padding:3px 9px;border-radius:999px;background:var(--book-soft);color:var(--ink);border:1px solid transparent;letter-spacing:.01em}
button.chip{cursor:pointer}
button.chip:hover,button.chip[aria-pressed="true"]{border-color:var(--book)}
.counts{font-family:var(--mono);font-size:12px;color:var(--ink-3);display:flex;gap:12px;flex-wrap:wrap}
.pending{border:1px dashed var(--line);border-radius:var(--r);padding:18px;color:var(--ink-3);font-size:15px;display:grid;gap:4px;align-content:center}
.pending b{color:var(--ink-2);font-weight:600}

/* book page */
.bookhead{padding-block:34px 0;border-bottom:1px solid var(--line)}
.bookhead .meta{display:flex;gap:16px;flex-wrap:wrap;align-items:center;font-size:14px;color:var(--ink-3)}
.bookhead h1{font-size:clamp(32px,4.6vw,50px);letter-spacing:-.015em;margin-top:8px}
.bookhead h1 span{display:block;font-size:.48em;font-style:italic;font-weight:400;color:var(--ink-2);margin-top:6px}
.essence{margin-top:22px;display:grid;grid-template-columns:repeat(3,1fr);gap:0;border:1px solid var(--line);border-radius:var(--r);background:var(--paper);overflow:hidden}
.essence>div{padding:16px 18px;border-left:1px solid var(--line);font-family:var(--display);font-size:17.5px;line-height:1.4}
.essence>div:first-child{border-left:0}
.essence>div b{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--book);margin-bottom:6px;font-weight:500}
.tabs{display:flex;gap:2px;overflow-x:auto;margin-top:18px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{white-space:nowrap;padding:10px 14px;font-size:15px;font-weight:500;color:var(--ink-2);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--book)}
.tabs button.cl[aria-selected="true"]{border-bottom-color:var(--claude)}
.tabs button span{font-family:var(--mono);font-size:11px;color:var(--ink-3);margin-left:6px}
.panel{padding-block:28px}
.panel h2{font-size:28px;margin-bottom:6px}
.panel .lead{color:var(--ink-2);max-width:66ch;margin-bottom:22px;font-size:16.5px}

/* overview tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.tile{text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:grid;gap:10px;align-content:start;min-width:0;transition:border-color .15s}
.tile:hover{border-color:var(--book)}
.tile.cl:hover{border-color:var(--claude)}
.tile .th{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.tile .th h3{font-size:21px}
.tile .n{font-family:var(--mono);font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.tile ul{margin:0;padding:0;list-style:none;display:grid;gap:6px;font-size:15px;color:var(--ink-2)}
.tile li{padding-left:14px;position:relative}
.tile li::before{content:"";position:absolute;left:0;top:.62em;width:6px;height:1px;background:var(--book)}
.tile.cl li::before{background:var(--claude)}
.tile .go{font-size:14px;font-weight:600;color:var(--book)}
.tile.cl .go{color:var(--claude)}
.tile.wide{grid-column:1/-1}
.tile.yours{border-style:dashed}

/* claude layer marker */
.cl-badge{display:inline-flex;white-space:nowrap;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--claude);background:var(--claude-soft);padding:3px 8px;border-radius:999px}
.cl-badge::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--claude)}
.book-badge{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--book);background:var(--book-soft);padding:3px 8px;border-radius:999px}

/* lists */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;display:grid;gap:8px;align-content:start;min-width:0}
.card h3{font-size:21px}
.card .ex{font-size:15px;color:var(--ink-2);border-top:1px solid var(--line-2);padding-top:8px}
.card .ex b{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:500;display:block;margin-bottom:2px}
.card .src{font-family:var(--mono);font-size:12px;color:var(--ink-3)}
.card.cl{border-color:var(--claude);border-style:dashed;background:transparent}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.anec{display:grid;grid-template-columns:1fr;gap:14px}
.anec .card{grid-template-columns:1fr;max-width:none}
.anec .story{font-size:16.5px;max-width:72ch}
.anec .lesson{font-family:var(--display);font-style:italic;font-size:17px;color:var(--ink-2);border-left:2px solid var(--book);padding-left:12px}
.use{font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--book);font-weight:500}
.quotes{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.q{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px 16px;display:grid;gap:8px;align-content:start;min-width:0}
.q blockquote{margin:0;font-family:var(--display);font-size:21px;line-height:1.3;font-weight:500}
.q blockquote::before{content:"\201C";color:var(--book);margin-right:2px}
.q .who{font-size:14px;color:var(--ink-2)}
.q .ctx{font-size:14.5px;color:var(--ink-3)}
.q .type{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--book)}
.style-grid{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-bottom:28px}
.style-grid h3{font-size:20px;margin-bottom:6px}
.sample{font-family:var(--display);font-size:20px;line-height:1.4;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;position:relative}
.sample::before{content:"Sample opening";font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);display:block;margin-bottom:8px}
.tech{display:grid;gap:12px}
.tech .card{grid-template-columns:1fr 1fr 1fr;gap:18px}
.tech .card>div{min-width:0}
.tech .card b.l{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:500;margin-bottom:4px}
.tech .card .steal{color:var(--ink)}
.tech .card .steal b.l{color:var(--book)}
.info{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:22px;overflow-x:auto}
.info svg{display:block;max-width:100%;height:auto}
.info h3{font-size:22px;margin-bottom:4px}
.hooks{display:grid;gap:14px}
.hook{background:var(--paper);border:1px dashed var(--claude);border-radius:var(--r);padding:20px 22px;display:grid;grid-template-columns:1.6fr 1fr;gap:22px;min-width:0}
.hook>div{min-width:0}
.hook h3{font-size:21px;margin-bottom:8px}
.hook .ninety{font-size:16.5px;max-width:70ch}
.hook .side{display:grid;gap:12px;align-content:start}
.hook .side b.l{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--claude);font-weight:500;margin-bottom:3px}
.hook .side .oq{font-family:var(--display);font-style:italic;font-size:18px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.plain{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.plain li{padding-left:16px;position:relative;font-size:16px}
.plain li::before{content:"";position:absolute;left:0;top:.68em;width:8px;height:1px;background:var(--claude)}
.xp{display:grid;gap:10px}
.xp .card{grid-template-columns:200px 1fr;gap:18px;align-items:start}
.xp .with{font-family:var(--display);font-size:18px;font-weight:500}
.xp .with.in{color:var(--accent)}
.xp .with button{text-align:left;font-family:inherit;font-size:inherit;font-weight:inherit;color:var(--accent);text-decoration:underline;text-underline-offset:3px;padding:0}

/* themes */
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.theme{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:grid;gap:10px;min-width:0}
.theme h3{font-size:22px}
.theme .bk{display:grid;gap:6px}
.theme .bk button{text-align:left;display:flex;gap:10px;align-items:center;font-size:15px;color:var(--ink-2);padding:0}
.theme .bk button:hover{color:var(--ink)}
.dot{width:10px;height:10px;border-radius:2px;flex:none}
.bridge{background:var(--paper);border:1px dashed var(--claude);border-radius:var(--r);padding:20px 22px;display:grid;grid-template-columns:220px 1fr;gap:20px;min-width:0}
.bridge>div{min-width:0}
.bridge .pair{display:grid;gap:8px;align-content:start}
.bridge .pair button{text-align:left;display:flex;gap:10px;align-items:flex-start;font-size:15px;line-height:1.3;color:var(--ink-2);padding:0}
.bridge .pair button:hover{color:var(--ink)}
.bridge .pair .dot{margin-top:5px}
.bridge .pair .vs{font-family:var(--mono);font-size:11px;color:var(--ink-3);letter-spacing:.08em;padding-left:20px}
.bridge h3{font-size:21px;margin-bottom:6px}
.bridge .theme-tag{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--claude)}

/* finder */
.finder-head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.finder-head h2{font-size:28px}
.fr{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:grid;gap:6px;min-width:0}
.fr .from{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-3)}
.fr .from button{color:var(--accent);font-weight:500;padding:0}
.fr h3{font-size:20px}
.fr p{font-size:15.5px;color:var(--ink-2)}

footer{border-top:1px solid var(--line);padding-block:22px;font-size:14px;color:var(--ink-3);display:flex;gap:18px;flex-wrap:wrap;justify-content:space-between}

/* page-at-a-glance */
.viz{margin:0 0 22px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px 14px;overflow-x:auto}
.viz figcaption{display:grid;gap:2px;margin-bottom:12px}
.viz figcaption b{font-family:var(--display);font-size:20px;font-weight:500}
.viz svg{display:block;max-width:100%;height:auto}
.viz.book{border-color:var(--book)}
.why{font-size:15px;color:var(--ink-2);max-width:72ch;margin-bottom:18px;padding-left:12px;border-left:2px solid var(--book)}
.why b{color:var(--ink);font-weight:600}
.rk{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:5px;background:var(--book);color:#fff;font-family:var(--display);font-size:14px;font-weight:600;flex:none;font-variant-numeric:tabular-nums}
.card.cl .rk,.hook .rk,.xp .rk{background:var(--claude)}
.matrix{display:grid;grid-template-columns:repeat(var(--cols),minmax(150px,1fr));gap:10px;min-width:0}
.mcol{display:grid;gap:6px;align-content:start;min-width:0}
.mhead{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--book);border-bottom:1px solid var(--line);padding-bottom:6px;display:flex;justify-content:space-between}
.mhead span{color:var(--ink-3)}
.mchip{text-align:left;font-size:13.5px;line-height:1.3;padding:6px 8px;border-radius:4px;background:var(--bg);display:flex;gap:6px;align-items:flex-start;color:var(--ink)}
.mchip .rk{width:18px;height:18px;font-size:11px;border-radius:3px;margin-top:1px}
.mchip:hover{background:var(--book-soft)}
.mchip.q{font-family:var(--display);font-size:14.5px}
.linkrow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.lk{display:grid;gap:4px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);text-decoration:none;background:var(--bg);min-width:0}
.lk:hover{border-color:var(--book)}
.lk-k{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--book)}
.lk b{font-weight:600;line-height:1.3}
.tile.links{cursor:default}
.tile.links:hover{border-color:var(--line)}
@media (max-width:820px){.linkrow{grid-template-columns:1fr}.matrix{grid-template-columns:repeat(var(--cols),minmax(170px,1fr))}}

.tabs button.yn[aria-selected="true"]{border-bottom-color:var(--ink)}
.yn-badge{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink);background:var(--line-2);padding:3px 8px;border-radius:999px;white-space:nowrap}
.plain.yn li::before{background:var(--ink)}
.oq-card{font-family:var(--display);font-style:italic;font-size:18px;border:1px dashed var(--line);border-radius:var(--r);padding:14px 16px;background:var(--paper)}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.slide{display:block;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--paper);transition:border-color .15s}
.slide:hover{border-color:var(--book)}
.slide img{display:block;width:100%;height:auto}
.thumbs{display:flex;gap:6px;overflow:hidden}
.thumbs img{height:64px;width:auto;border:1px solid var(--line);border-radius:3px;background:#fff}
.tile.yours{border-style:dashed;border-color:var(--ink-3)}
.chip.plainchip{background:var(--paper);border-color:var(--line);font-size:13.5px;padding:5px 11px}
.regions{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.region{border:1px solid var(--line);border-left:3px solid var(--book);border-radius:var(--r);padding:12px 14px;background:var(--bg);display:grid;gap:4px;min-width:0}
.region b{font-family:var(--display);font-size:18px;font-weight:500}
.region p{font-size:14.5px;color:var(--ink-2)}

@media (max-width:820px){
  .hero,.essence,.style-grid,.two,.hook,.tech .card,.xp .card,.bridge{grid-template-columns:1fr}
  .essence>div{border-left:0;border-top:1px solid var(--line)}

<script id="trove-data" type="application/json">{"books": [{"id": "nawabs-nudes-noodles", "title": "Nawabs, Nudes, Noodles", "subtitle": "India through 50 Years of Advertising", "author": "Ambi Parameswaran", "year": 2016, "pages": 271, "genre": "Business / cultural history of Indian advertising", "accent": "#D2691E", "essence": ["Advertising is a window on a society in transition: sometimes it mirrors India, sometimes it runs a step ahead, sometimes it reaches back for a forgotten ritual.", "Read the ads by audience (men, kids, teens, couples, the old, women) and by category (clothes, food, wheels, homes, mobiles, weddings, money, jobs, cricket) and you can watch a nation move from penny-pinching scarcity to a consumption era.", "The jingles we hum (Hamara Bajaj, Doodh Doodh, Jo Biwi Se Kare Pyaar, H for Hitler) are compressed social history; each one encodes who had power in the Indian home at that moment."], "tags": ["Indian Consumer", "Advertising", "Social Change", "Storytelling", "Brand Building", "Liberalisation"], "big_ideas": [{"title": "Ads are a societal seismograph", "idea": "Films, TV and novels get credited with reflecting India; Parameswaran argues that fifty years of commercials do it more precisely, because every ad is a bet on what the consumer already believes, elevated into myth (his nod to Barthes).", "example": "Introduction: he contrasts the pressure cooker sold as 'a symbol of love' in 1982 (Prestige) with the 2014 Airtel ad where a woman boss video-calls her subordinate husband home for dinner; same product category of marriage, forty years apart.", "rank": 1}, {"title": "Power in the Indian home has shifted, and the ads prove it", "idea": "Follow who is given the clinching line. Mothers who care (Dalda, 1950s), then kids with pester power (Rasna, Maggi), then the bargaining housewife (Surf's Lalita ji, 1984), then the man who washes (Ariel), then the teenager who tells Dad 'what do you want to know about sex?' (Tata Docomo, 2013).", "example": "FCB Ulka's content analysis: of thirty packaged-goods TV ads each from 1987, 1997 and 2007, only three showed working women; women in saris fell from over 65 per cent to 30 per cent by the late 2000s.", "rank": 2}, {"title": "Good advertising stays one step ahead (go further and the stones fly)", "idea": "The best campaigns depict a future that is just about to arrive, so consumers feel recognised rather than lectured. Go too far and you get 'stone pelting'; stay behind and you are invisible.", "example": "Chapter 'Jo Biwi Se Kare Pyaar': the Airtel boss-wife ad 'was a depiction of a future, not the current reality'. Chapter 'Twacha Se Meri Umar': Santoor's 1994 aerobics film worked because millions of women did not do aerobics but desired to look that fit.", "rank": 3}, {"title": "Get in through the margins of the thali", "idea": "Indian food habits are the hardest to change. Santosh Desai's 'thali theory' (quoted by the author) says brands win at the edges of the meal, not the centre: pickles, papads, biscuits, noodles as snacks, never the roti and sabzi.", "example": "Chapter 'Bachche Toh Bachche': Lijjat papad, Parle-G and Maggi 2-Minute Noodles (launched 1982 as a snack, not a meal) all sidestepped the thali; ready-to-eat chapattis still have no winner.", "rank": 4}, {"title": "Productise the service, service the product", "idea": "India's great category explosions happened when something expensive or intimidating was repackaged into a small, retail-shelf unit: the sachet, the prepaid card, the EMI, the Rs 5 Coke bottle.", "example": "Chapter 'Har Ek Friend Zaroori Hota Hai': FCB's New York experts told the agency in 2000 that 'only drug dealers use prepaid cards'; by 2014 over 90 per cent of Indian mobile subscriptions were prepaid. Airtel's 'Magic' card unlocked the phone from the tariff plan.", "rank": 5}, {"title": "Rename the problem, create the category", "idea": "Many categories were made legitimate by language before product: a taboo or a chore was rebranded so that consumers could talk about it.", "example": "Impotence became 'ED' before Viagra launched; hair dye became 'hair colour' (L'Oreal trained stylists, awarded 'hair stylists' not hairdressers); HSBC turned ATM into 'Any Time Money'; Citibank's 'Unfixed Deposit'; HUL got 'nikhri' to mean fair when Doordarshan banned 'gori'.", "rank": 6}, {"title": "The celebrity went from exception to default, and must now be 'cast'", "idea": "From the 1950s to 1980s a male star in an ad was a rarity (Dilip Kumar's pickle ad proved the rule); Big B's 1995 BPL campaign broke the dam. With everyone using stars, the smart move is to cast the star as a character, not a worshipped face.", "example": "Chapter 'Meri Khubsurti Ka Raaz': Priyanka Chopra as 'Manjeet, your silly village girl' for Hero Pleasure; SRK's extempore Abby speech thanking admen for the endorsement cheques that fund his experimental films. Cogito's 2002 study: aura of the star matters most.", "rank": 7}], "concepts": [{"name": "The Thali Theory", "definition": "Santosh Desai's idea that the Indian meal is a 'wardrobe full of food' eaten all at once; habits change easily only at the margins of the thali, so branded pickles and snacks succeed where branded rotis fail.", "source": "Chapter 'Bachche Toh Bachche, Baap Re Baap!'", "use_when": "Any talk on behaviour change: attack the periphery of a habit first, not its sacred centre.", "rank": 1}, {"name": "Productisation of Services / Servicisation of Products", "definition": "Venkat Ramaswamy's term, used to explain how prepaid recharge cards turned a telecom service into something a paan shop could stock, just as the sachet did for shampoo.", "source": "Chapter 'Har Ek Friend Zaroori Hota Hai'", "use_when": "Discussing how to unlock a mass market in India: shrink the unit of purchase and the unit of trust.", "rank": 2}, {"name": "Hyper-ritualisation (Goffman)", "definition": "Advertising exaggerates gender-defined roles beyond real life: men more masculine, women more feminine, in hyper-typical settings. Parameswaran closes by asking whether Indian advertising should move to 'neo-ritualisation'.", "source": "Chapter 'Twacha Se Meri Umar Ka Pata Hi Nahi Chalta'; Last Word", "use_when": "Critiquing why ads for soap or tea still default to the mother in the kitchen, or when arguing that media doesn't reflect but amplifies stereotypes.", "rank": 3}, {"name": "Pester Power (and its veto)", "definition": "1990s research term for children's growing voice in middle-class purchases: decisive for snacks and drinks, a 'veto' on soaps and toothpaste, a whisper even on cars. T Krishnakumar's corollary: launch kid products during school term, because a child treats a new ad as information to trade in class.", "source": "Chapter 'I am a Complan Girl! I am a Complan Boy!'", "use_when": "Talks on viral spread and word of mouth: the audience that will retell your message matters more than reach.", "rank": 4}, {"name": "Mera Brand Mahan / Hamara Bajaj film", "definition": "The national-integration montage genre: one brand shown being used across religions, regions, dress and class, set to an anthem (often in Raga Desh). Immortalised by Lintas for Bajaj in 1989; later used by Chevrolet, cement and fabric brands.", "source": "Chapter 'Hamara Bajaj, Hamara Bajaj'; 'Doodh Doodh Doodh'", "use_when": "Explaining how brands appropriate national mood, or when you need an example of format borrowed from state propaganda ('Mile Sur Mera Tumhara', 1988).", "rank": 5}, {"name": "Four rural hurdles (Pradeep Kashyap)", "definition": "Affordability, Availability, Awareness, Acceptability. Sachets, haats and Shakti Ammas, television and mobile ('Kan Khajura Tesan' missed-call radio), and value-for-money not feature-poor products.", "source": "Chapter 'Jai Jawan! Jai Kisan!'", "use_when": "Frameworks for reaching any under-served market; also the reminder that Diffusion of Innovation was first proven on farmers.", "rank": 6}, {"name": "Lifestage Marketing", "definition": "A bank customer is a customer for life unless hit by a lifestage change (marriage, new job, new city), so target the transitions. Learnt from Citibank/FCB; now powered by data analytics.", "source": "Chapter 'Zindagi Ke Saath Bhi, Zindagi Ke Baad Bhi!'", "use_when": "Any discussion of loyalty, churn or when people are persuadable.", "rank": 7}, {"name": "Mind & Mood studies (ManMood, WomanMood, YouthMood, AutoMood)", "definition": "FCB Ulka's recurring ethnographic reports built from extended home visits. ManMood 2014 found the 'sandwiched generation', 'you are only as good as the money you make', and 'vanity, thy name is man'. WomanMood 2001 vs 2015 charted the shift from Annapurna-provider to 'me space'.", "source": "Chapters 'The [In] Complete Man' and 'Twacha Se Meri Umar'", "use_when": "You need primary-research texture on the changing Indian family rather than census numbers.", "rank": 8}, {"name": "Colour coding and the product window", "definition": "Trade craft: the protagonist wears the brand colour (Cadbury girl in purple, Santoor mom in orange); the 'freight section' is the ingredient-explanation slab that has pushed average word counts in 30-second Indian ads from 41 (1980s) to 53 (2010s), against John Philip Jones's rule of thirty words or fewer.", "source": "Side boxes; chapter 'Bole Mere Lips, I Love Uncle Chipps'", "use_when": "Teaching visual-first communication, or making the case that pre-testing and brand extensions bloat messages.", "rank": 9}, {"name": "Trait Fit, Compatibility, Aura", "definition": "Cogito Consulting's 2002 three-index model for celebrity endorsement; the finding was that aura swamps the other two, so brands chase the biggest star.", "source": "Chapter 'Meri Khubsurti Ka Raaz'", "use_when": "Explaining why celebrity fees look rational next to a Rs 100 crore media budget, or warning against them for 'serious' categories.", "rank": 10}], "anecdotes": [{"title": "The pressure cooker and true love", "story": "A demure new bride and her husband enter an appliance shop. The wizened shopkeeper asks the young man how much he loves his wife. If more than life itself, he must buy the cooker with the 'Gasket Release System', safe even if the vent clogs. Then the clincher: 'Jo biwi se sach-much karte pyaar, woh Prestige se kaise kare inkaar!' Prahlad Kakkar, a confirmed bachelor, directed it in 1982. Over 80 per cent of Indian homes own a pressure cooker today. In 2014 Prestige reran the line with Aishwarya Rai and Abhishek Bachchan, except now Abhishek says nothing impresses Aishwarya like a meal cooked by him. The slogan survived; the cook changed gender.", "use_as": "opener", "lesson": "Marry a rational promise to an emotional one, then let the emotion age with society.", "rank": 1}, {"title": "Only drug dealers use prepaid", "story": "In 2000 FCB Ulka was pitching for a new mobile operator and knew nothing about telecom. They called FCB New York, who had handled AT&T for years. Airtel had just launched a prepaid card called Magic in Delhi, so the Indians asked the Americans what to make of prepaid. The answer: 'Why would anyone buy a prepaid mobile card? In the US, only drug dealers use prepaid cards.' Parameswaran writes simply: 'How wrong they were!' Prepaid unlocked the handset from the bill, made recharge a thing a paan shop could sell, and by 2014 over 90 per cent of Indian mobile connections were prepaid.", "use_as": "turning point", "lesson": "Imported expertise can be precisely wrong about a market's structure.", "rank": 2}, {"title": "Hari Sadu, H for Hitler", "story": "A boss in a foul mood is booking a poolside table. The hotel clerk can't catch his name, so the subordinate whose report he just flung aside offers to spell it: 'Hari Sadu. H for Hitler, A for Arrogant, R for Rascal, I for Idiot.' The second executive, stirring the boss's tea, holds up the spoon: 'S for Shameless.' Super: 'Guess who's just heard from us? Naukri.com.' FCB Ulka's research had found the unsaid reason people change jobs is not salary or title but that they cannot stand their immediate superior. Directed by Rajesh Krishnan, the film was rated one of the best of its decade and made Naukri India's biggest job site.", "use_as": "turning point", "lesson": "The insight people won't say in a survey is the one worth building a campaign on.", "rank": 3}, {"title": "Darshanbhai remembers the second line", "story": "The author went to meet Darshan Patel of Paras Pharma, the man behind Moov, Krack and Itch Guard, hoping to win business. Patel's opening question floored him: 'Why have you dropped the second line of the Nerolac jingle?' FCB Ulka had just relaunched 'Jab ghar ki raunaq badhani ho' to a rap beat in 1999 and had quietly cut the old second line. Patel sang it back: 'Rangon ki duniya mein aao, rangeen sapne sajao, Nerolac.' The jingle had been off air for seven years. The complaint, Parameswaran realised, was also the highest compliment a jingle can receive.", "use_as": "proof point", "lesson": "A tune lodged in memory is brand equity; edit it at your peril.", "rank": 4}, {"title": "The Japanese bosses and Kancha", "story": "Maruti's most famous film has two young men lost in the high mountains. They ask a Nepali boy, Kancha, if there is a place to eat. No. A place to sleep? No. A Maruti service station? He nods. The signboard reads 'Zozilla Engineering Works, Maruti Service Station'. Maruti's visiting Japanese bosses thought it a ridiculous over-claim and would not approve it. Arun Malhotra, then at Maruti, quietly screened it at a dealer conference in Punjab. The dealers rose as one in a standing ovation; the bosses relented. Zozilla, incidentally, is a real Maruti-authorised station in Kargil, a town that would become famous years later.", "use_as": "proof point", "lesson": "When the boardroom doubts an idea, let the people who sell it vote.", "rank": 5}, {"title": "Spacing paddy, spacing children", "story": "A family-planning film on Doordarshan in the late 1970s: an older farmer transplanting paddy asks his young helper, now father of a baby girl, whether another child is coming. 'Soon, hopefully.' The farmer replies that just as saplings need space between them to grow well, children need space so each gets attention. Parameswaran saw it as a schoolboy with no thought of advertising, and it has never left him. Compare ITC's rural Punjab line for Red Lamp cigarettes: 'Paani pump da, cigarette Lamp da.' Both work by borrowing an analogy the listener already lives inside.", "use_as": "opener", "lesson": "The most durable persuasion uses a metaphor from the audience's own daily work.", "rank": 6}, {"title": "The python testifies", "story": "In mid-1995 Tuffs shoes ran a half-page Times of India ad: Milind Soman and Madhu Sapre nude except for shoes and a python wrapped around them. Brand, agency Ambience, founder Ashok Kurien, models, all were charged under the Indecent Representation of Women Act; even the Wild Life Protection Act was invoked for the snake. Judges kept changing. At one hearing a judge asked who could testify that the models had not indulged in any sexual activity during the shoot. A voice from the back: 'The python.' Outside court in 2004 an old woman, not recognising Soman, asked who all these waiting people were and what they had done. 'Koi chor log honge,' he said. The case was dismissed fourteen years later.", "use_as": "closer", "lesson": "In India the moral storm outlives the campaign by a generation; budget for it.", "rank": 7}, {"title": "The navel at Mandi House", "story": "In 1984, as group product manager at Boots, Parameswaran relaunched Sweetex with a Trikaya film by Prahlad Kakkar: a girl squeezing into jeans to 'No squeeze, no wheeze, no sugar in my coffee, please.' Doordarshan had cleared the storyboard but rejected the film as obscene: a close-up of the model's navel as she measured her midriff. He flew to Delhi and argued that Chhayageet the previous evening had shown five film-star navels, one serving as a table for a hero, and that temple goddesses bare their midriffs. He was lectured on how all such exposure would be abolished. The shot was reshot cheaply; the brand, 'a little too ahead of its time', died within a year.", "use_as": "cautionary tale", "lesson": "Censorship is arbitrary; keep a cheap Plan B for the one shot that might offend.", "rank": 8}, {"title": "Dilip Kumar wants to emigrate", "story": "In 1992 the author sat outside a Chennai recording studio making a low-cost film for a roofing brand called Literoof. The young music director, whom he knew as Dilip Kumar, once of Ilayaraja's troupe, asked: 'Sir, I am thinking of immigrating to Australia. What do you think?' Parameswaran mumbled that leaving India just as it was about to grow would be a mistake. Dilip did not look convinced; then the singer Subha arrived and they got to work. Dilip was AR Rahman. Shankar-Ehsaan-Loy and Ram Sampath also cut their teeth on thirty-second jingles; later Rahman would compose Airtel's signature.", "use_as": "closer", "lesson": "The jingle studio is India's conservatoire; talent incubates in the thirty-second format.", "rank": 9}, {"title": "The farmer's wife and Captain Cook atta", "story": "A man storms into his farmhouse grumbling that the Captain Cook atta company demands wheat of uniform size that sounds right when shaken, as if buying gold not grain. His wife replies that is why their atta is so good, and look, you ate so many rotis. 'You too are using Captain Cook?' Then: 'Give me one more roti.' A critic asked which country the agency thought it was in, showing a farmer's wife using packaged flour. The choice was deliberate: she would be the last adopter, so her using it made the claim credible. Captain Cook (1990s, FCB Ulka, dir. Deven Khote) succeeded and drew Annapurna and Aashirvaad into branded atta.", "use_as": "proof point", "lesson": "Show the hardest-to-convert user converting; that is the strongest proof.", "rank": 10}, {"title": "The lost blue blazer", "story": "In 1993 the author left his favourite blue jacket on a delayed Indian Airlines flight. At the Lost and Found counter the old executive, hearing he worked in advertising, mocked him: 'It took you five days to figure this out? You guys in advertising drink a lot, don't you?' This was a decade before Mad Men. Riled, Parameswaran sat the man down and gave him a lecture on what the ad business actually does. They parted friends, he with his jacket, the clerk with a slightly better understanding of advertising. The whole book, he says, is written so that the next adman who loses a blazer gets a little more sympathy.", "use_as": "opener", "lesson": "Everyone has opinions about ads; almost nobody knows the industry.", "rank": 11}, {"title": "Who built India's roads?", "story": "Speaking at an auto company's sales conference, the author asked the room who architected India's modern road network. 'Vajpayee,' they shouted. Before him? 'Sher Shah Suri,' from the back. Before him? A timid 'Chandragupta.' One ruler two thousand years ago, one five hundred years ago, and then nothing until the Golden Quadrilateral in 2001. Roads grew from 2.45 million km in 2001 to 3.32 million in 2011, more new road in a decade than the whole network of 1971. His point to the car sellers: your market was created by asphalt, and a village within 10 km of a highway gets a 10 per cent economic boost.", "use_as": "opener", "lesson": "Infrastructure, not advertising, opens categories; advertising then names the desire.", "rank": 12}], "quotes_and_humour": [{"line": "Jo biwi se sach-much karte pyaar, woh Prestige se kaise kare inkaar!", "who": "Prestige pressure cooker ad, 1982 (dir. Prahlad Kakkar)", "context": "A gasket release system sold as proof of marital love; the line outlived the gender roles it was born in.", "type": "jingle", "rank": 1}, {"line": "H for Hitler, A for Arrogant, R for Rascal, I for Idiot.", "who": "Naukri.com 'Hari Sadu' ad, FCB Ulka", "context": "The subordinate spells the boss's name to a hotel clerk; a colleague adds 'S for Shameless'.", "type": "joke", "rank": 2}, {"line": "Ab main bilkul boodha hoon, goli kha ke jeeta hoon, lekin aaj bhi ghar ke andar, roshni deta Bajaj.", "who": "Bajaj bulbs jingle, c. 1985, written by Mukul Upadhyay", "context": "Old age in the 1980s coded as a life of pills; by the 2000s insurance ads showed the old buying diamonds and flying to weddings.", "type": "jingle", "rank": 3}, {"line": "If you treat a cold, it will go away in seven days. If you don't treat a cold, it will go away in a week.", "who": "A consumer in Boots' Coldarin research, late 1970s", "context": "The insight that a cold is a minor illness but a major botheration led to 'Kya haal bana rakha hai? Kuch lete kyun nahin?'", "type": "joke", "rank": 4}, {"line": "Why would anyone buy a prepaid mobile card? In the US, only drug dealers use prepaid cards.", "who": "FCB New York telecom experts to FCB Ulka, 2000", "context": "Prepaid went on to be over 90 per cent of Indian mobile connections.", "type": "one-liner", "rank": 5}, {"line": "Do you want us to be a nation of maids?", "who": "PM Narasimha Rao (as reported), to an MP opposing cheaper washing machines", "context": "Excise on durables cut from 60 to 15 per cent in the early 1990s; the MP feared domestic servants would lose jobs.", "type": "one-liner", "rank": 6}, {"line": "Choola alag chalta hai, lekin hum saath khana khate hain.", "who": "A young wife in a UP town, in an FCB Ulka Mind & Mood session", "context": "Separate kitchens, shared dinners: the 'separate yet together' family that lets women work.", "type": "aphorism", "rank": 7}, {"line": "Just as good writers capture the fringes of society... does advertising have the courage to do that? Or will advertising stay in the middle of the road?", "who": "Harish Bhat, Tata Group, discussing the Fastrack 'closet' ad", "context": "The question the book ends its final chapter on.", "type": "aphorism", "rank": 8}, {"line": "Doodh doodh doodh doodh, wonderful doodh, piyo glassful.", "who": "NDDB milk campaign, FCB Ulka, mid-1990s", "context": "A reggae tune and one of the first systematic Hinglish jingles; an ad-industry anthem video opens with it.", "type": "jingle", "rank": 9}, {"line": "Figure: Chubby; Hair: Preferably; Chin: Double; Eyes: Brown; Skin: Peachy; Age: 8-12 months.", "who": "Johnson & Johnson 'Nude Models Wanted' ad, Chris Rosario, Trikaya, 1993", "context": "Casting call for baby models, voted ad of the decade; unlike the Tuffs nudes it drew no court case.", "type": "joke", "rank": 10}, {"line": "Your generation did not have a choice... even if my venture fails, it would be seen as a positive on my bio-data.", "who": "Krishna Ramkumar, Avanti Fellows, ex-BCG, to the author", "context": "Why today's youth can take career risks the author's generation could not.", "type": "aphorism", "rank": 11}, {"line": "Six Munths Agao I Cuddn't Evun Spull Engunier. Now I are One.", "who": "Cartoon in IIT Madras magazine Campastimes, 1970s", "context": "Quoted after Narayana Murthy's remark that half of India's engineering graduates cannot be called engineers.", "type": "joke", "rank": 12}], "writing_style": {"voice": "A practitioner-raconteur: first person, warm, slightly self-deprecating, constantly saying 'I suspect' and 'I wonder if'. He mixes agency war stories (he spent 27 years at FCB Ulka) with census statistics, academic citations (Goffman, Barthes, Schudson, Bijapurkar) and trade gossip, and is never afraid to admit a campaign of his own failed.", "structure": "Four sections (People, Products, Services, Ad Narratives) of stand-alone chapters, each titled with a jingle or tagline and each tracing one lens (men, kids, couples, wheels, weddings, money, jobs, music, celebrities, censorship) across decades. Almost every chapter opens on a single vivid ad or personal scene, widens to the category's history, drops in a few hard numbers, and closes with a speculative question about the future. Grey side-boxes scattered through the text explain trade craft (green screen, stock photos, body doubles, colour coding).", "techniques": [{"technique": "Then-and-now pairing", "how_it_works": "He repeatedly sets a 1970s-80s ad beside a 2010s ad on the same theme (Prestige vs Airtel on marriage; Bajaj bulbs vs SBI Life on old age; Wheel's job-seeker vs Naukri's rebel) and lets the gap do the arguing.", "steal_it": "For any 'how India has changed' point, find two artefacts forty years apart and describe both before interpreting either.", "rank": 1}, {"technique": "Open on a scene, not a thesis", "how_it_works": "Chapters begin mid-action ('The door slams open. The angry husband is back home.' or 'Aap ka agency ka capacity kya hai?') and only after a paragraph or two reveal the brand and the year.", "steal_it": "Start a talk by narrating one ad or incident shot by shot; name the brand only after the audience is inside the story.", "rank": 2}, {"technique": "The one sobering number", "how_it_works": "After an anecdote he lands a single statistic that reframes it: 55 licensed TV sets when Nehru died; mean female marriage age 18.3 to 19.3 in a decade; women 48.9 per cent of population, 2.7 per cent of CEOs.", "steal_it": "Pair every story with exactly one number, chosen for shock, not completeness.", "rank": 3}, {"technique": "Confess the failure", "how_it_works": "He narrates his own misfires (Sweetex, Colgate's sachet that flopped, his hypothesis about school holidays demolished by T Krishnakumar) with the same relish as the hits.", "steal_it": "Include at least one story where you were wrong; it buys credibility for the rest.", "rank": 4}, {"technique": "End with a question, not a conclusion", "how_it_works": "Chapters close on 'I wonder if this cultural icon will ever be replaced by the local pizza delivery man?' or Harish Bhat's challenge about the fringes of society.", "steal_it": "Finish sections of a talk with a forward-looking question so the audience carries the thinking home.", "rank": 5}, {"technique": "Trade-secret side boxes", "how_it_works": "Short boxed asides ('Shooting ice cream: it's mashed potatoes', 'Elevator pitch: thirty-five words') give the reader insider pleasure without breaking the main argument.", "steal_it": "In a long essay or deck, drop two-line 'how it's really done' asides; readers quote those first.", "rank": 6}], "sample_opening": "I WAS LOOKING for my favourite blue jacket and could not find it in my closet. I was sure that the jacket was not with the dry-cleaners."}, "infographic": {"type": "timeline", "title": "India in Thirty Seconds: Six Decades of the Indian Home as Seen on TV", "description": "A decade-by-decade timeline (1960s to 2010s) placing the book's landmark campaigns against the social shift each one encoded, from scarcity and macho carbolic soap to Hinglish, pester power and social-media juries. Each node names one or two ads and the role that held power in the household at that moment.", "elements": [{"label": "1960s: Scarcity and the convent-educated adman", "detail": "Lifebuoy 'Tandurusti ki raksha' (brawny men, football, carbolic soap); Dalda 'Mothers who care' via demo kitchens; Wills 'Made for each other' contest (1969); Amul topicals begin at the Bombay Derby. 55 licensed TV sets in 1964. Power in the home: the dutiful mother.", "position_or_order": "1960s"}, {"label": "1970s: Cinema halls and the Emergency", "detail": "Liril girl under the waterfall (1974) as the country lost its freedoms; Thums Up 'Happy days are here again' after Coke's exit; Charms 'spirit of freedom'; Bajaj scooter waiting lists; family-planning paddy film on Doordarshan. Power: the father who books the scooter.", "position_or_order": "1970s"}, {"label": "1980s: Colour TV and the housewife's voice", "detail": "Asian Games 1982 bring colour TV; Onida 'Neighbour's envy, owner's pride'; Maggi 2-Minute Noodles (1982) and 'Bhook lagi hai, Mummy'; Surf's bargaining Lalita ji (1984); Rasna girl; Prestige 'Jo biwi se kare pyaar'; Hamara Bajaj (1989); Nirma vs Lever. Power: the value-hunting housewife and the pestering child.", "position_or_order": "1980s"}, {"label": "1990s: Liberalisation and the complete man", "detail": "Raymond 'The Complete Man' (friend in a wheelchair, Teach Your Children); Uncle Chipps brings Hinglish (1992); 'Doodh Doodh'; Pepsi 'Yeh dil maange more' (1998); Ariel shows a man washing; Santoor's aerobics mummy (1994); KamaSutra (1991) and the Tuffs nudes (1995) test the censors; prepaid Magic (1999). Power: the aspiring couple.", "position_or_order": "1990s"}, {"label": "2000s: Celebrities, mobiles and the working daughter", "detail": "KBC and Big B reborn (2000); Reliance 'Kar lo duniya mutthi mein' (2002); Thanda matlab Coca-Cola; Fair & Lovely's airhostess (fair to get a job, not a husband); Fair & Handsome for men (2005); Naukri 'Hari Sadu'; Air Deccan's carpenter flies; Hero Pleasure 'Why should boys have all the fun?' (2005); ZooZoos (2009). Power: the educated daughter and the subordinate who answers back.", "position_or_order": "2000s"}, {"label": "2010s: Hashtags and social-media juries", "detail": "Airtel 'Har ek friend' (2011) and the boss-wife video call (2014); Tanishq's remarriage with daughter; Tata Docomo's 'sure Dad, what do you want to know?'; Havells juicer and #ShareTheLoad; Fastrack 'come out of the closet' (2012); Kalyan's fanning child apology (2015); Maggi ban and comeback. Power: the teenager with the smartphone, and Twitter.", "position_or_order": "2010s"}, {"label": "2020s (author's forecast): The Consumption Era", "detail": "Ad spend rises from 0.5 to 0.8 per cent of GDP; NCCS erases the rural-urban lens; men learn to cook; government becomes the biggest advertiser; a million small film-makers make brand content; potlatch weddings and faster obsolescence.", "position_or_order": "2020s (forecast)"}]}, "claude_layer": {"blind_spots": ["It is an insider's history told largely from FCB Ulka's archive; campaigns the author worked on (Santoor, Sundrop, Naukri, Indica, Captain Cook, Doodh Doodh) get the most loving detail, which skews the sample of 'landmark' work towards one agency and towards television over print, outdoor and regional-language advertising.", "He often defends ads that reflect 'societal truth' (Fair & Lovely's airhostess, the Airtel wife-as-cook) without fully reckoning with advertising's role in manufacturing that truth; the fairness-cream chapter in particular lets the industry off lightly on colourism.", "Causality runs loose: liberalisation, television penetration and the ads arrive together and the book rarely tries to separate which drove which. The claim that male grooming was 'single-handedly' created by marketing is asserted, not tested.", "Written in 2015, it treats e-commerce discounting, mobile video and social-media outrage as incoming weather; the smartphone-first, performance-marketing, influencer era that followed makes some of the mega-trend forecasts already look like the end of a chapter rather than the start."], "counterpoints": ["Rama Bijapurkar (We Are Like That Only) argues Indian consumers are not a developing-country version of Western ones but a structurally different market; where Parameswaran reads ads as India catching up with 'global cohorts' (men cooking, women working), she would say the trajectory itself is Indian-specific and may never converge.", "Byron Sharp (How Brands Grow) would push back on the book's faith in positioning and emotional insight; his evidence says brands grow through mental and physical availability and light buyers, which fits the book's own best data (Raymond's 700 stores, sachets, prepaid) better than its celebration of clever scripts.", "Arvind Rajagopal (Politics After Television), whom the author cites approvingly, reads the same 1980s-90s Doordarshan era as the moment advertising and Hindu nationalism learned the same visual grammar; the book notes bazaar gods and calendar art but keeps the political implication at arm's length."], "cross_pollination": [{"with": "Santosh Desai, Mother Pious Lady", "link": "Desai's thali theory is borrowed wholesale here; read the two together for the fullest account of why Indian food brands win at the snack and lose at dinner, and extend it to any entrenched habit.", "rank": 1}, {"with": "Roland Barthes, Mythologies", "link": "The book's thesis that detergents and margarine sell by tapping existing myths is Barthes verbatim; use the Indian examples (Prestige cooker, Hamara Bajaj) as a desi Mythologies when explaining semiotics to a business audience.", "rank": 2}, {"with": "Chip and Dan Heath, Made to Stick", "link": "The paddy-spacing family-planning film and 'Paani pump da, cigarette Lamp da' are textbook Concrete and Unexpected; the Nerolac second-line story is the sticky-jingle test. Use when teaching how to make a public-health or policy message memorable.", "rank": 3}, {"with": "Everett Rogers, Diffusion of Innovations", "link": "Parameswaran points out the adoption curve was first proven on mid-western farmers buying hybrid seed, which makes his 'rural consumers are not less sophisticated' argument; pair with the Captain Cook farmer's-wife ad as a case of deliberately showing the laggard adopting.", "rank": 4}, {"with": "Daniel Pink, Drive", "link": "The author himself imports Pink's intrinsic vs extrinsic motivation to explain Naukri's 'Hari Sadu' insight that people quit bosses, not jobs; a ready bridge between a marketing anecdote and a leadership talk.", "rank": 5}, {"with": "Shashi Tharoor and Rachel Dwyer on Bollywood", "link": "The book's parallel timeline of films (Mother India, Zanjeer, DDLJ, Vicky Donor) and ads shows both media moving in lockstep; useful when arguing that popular culture, not policy, is the best record of value change in India.", "rank": 6}], "talk_hooks": [{"title": "One slogan, two cooks", "ninety_second_version": "In 1982 a young couple walks into an appliance shop. The shopkeeper asks the husband how much he loves his wife. If more than life itself, he must buy the pressure cooker with the gasket release system. The clincher: 'Jo biwi se sach-much karte pyaar, woh Prestige se kaise kare inkaar.' Marital love, equated to a safety valve. It sold millions. Jump to 2014. Same brand, same line, now with Aishwarya Rai and Abhishek Bachchan. Except Abhishek is the one saying nothing impresses his wife like a meal he has cooked. The slogan did not change in thirty-two years. The person holding the ladle did. That is Ambi Parameswaran's whole argument in one campaign: advertising rarely invents social change, but it is the most honest record of it, because every ad is a bet on what the audience already believes. If you want to know who had power in the Indian kitchen in any decade, don't read the census. Watch who gets the last line in the ad.", "two_sentence_version": "Prestige's 1982 'Jo biwi se kare pyaar' line survived unchanged into a 2014 ad where the husband does the cooking. The slogan held; society moved around it.", "opening_question": "Which Indian ad line from your childhood could run unchanged today, and what would have to change in the picture?", "rank": 1}, {"title": "Attack the edge of the thali", "ninety_second_version": "Why can you buy branded pickle, branded papad, branded biscuits and branded noodles anywhere in India, but nobody has built a big brand of packaged roti and sabzi? Santosh Desai's answer, which Ambi Parameswaran borrows, is the thali. An Indian meal is a wardrobe of food laid out all at once. The centre, the rice or roti and the dal, is sacred and almost impossible to change. The margins, the pickle, the papad, the sweet, are where habits are loose. Lijjat papad, Parle-G and Maggi all won because they never attacked the centre. Maggi was launched in 1982 as a snack, not a meal: 'two minutes' between school and dinner. The idea travels well beyond food. Whatever behaviour you are trying to change in a customer, a team or a country, find the margin of the thali. Change the garnish first. The centre falls later, if at all.", "two_sentence_version": "Indian food brands succeed at the edge of the thali (pickle, papad, snack noodles) and fail at its centre (roti, sabzi). Behaviour change works the same way: start at the margins of a habit.", "opening_question": "What is the sacred centre of your customer's routine, and what is the pickle at the edge of the plate?", "rank": 2}, {"title": "Only drug dealers use prepaid", "ninety_second_version": "In the year 2000 an Indian ad agency was pitching for a new mobile operator. Mobiles were for the rich: Rs 16 a minute, a Rs 2,500 monthly plan, a deposit, a handset bundled in. Airtel had just launched something odd called a prepaid card. So the agency called its American parent, which had handled AT&T for decades, and asked what to make of prepaid. The answer came back from New York: 'Why would anyone buy a prepaid card? In the US only drug dealers use prepaid cards. Don't even consider it.' Within fifteen years more than ninety per cent of India's mobile connections were prepaid. Prepaid did for telecom what the sachet did for shampoo: it shrank the unit of purchase and the unit of trust until a paan shop could sell it. The lesson is not that the Americans were foolish. It is that expertise is local. The structure of your market, not the sophistication of your advisor, decides what a product is.", "two_sentence_version": "FCB's New York experts told their Indian colleagues in 2000 that only drug dealers buy prepaid cards; by 2014 prepaid was over 90 per cent of Indian mobile. Shrinking the unit of purchase beat every imported best practice.", "opening_question": "What is the 'prepaid card' in your industry, the thing the experts say no respectable customer would buy?", "rank": 3}, {"title": "The second line of the jingle", "ninety_second_version": "Ambi Parameswaran once went to meet Darshan Patel, the Ahmedabad marketer behind Moov and Krack, hoping to win some business. Before he could pitch anything, Patel asked: 'Why have you dropped the second line of the Nerolac jingle?' The agency had just relaunched 'Jab ghar ki raunaq badhani ho' to a rap beat and quietly cut the old second verse. Patel sang it back to him word for word. That jingle had been off air for seven years. Think about what that means. A busy entrepreneur had carried a paint company's melody in his head for most of a decade, and noticed the moment a line went missing. That is what a brand asset actually is: not a logo file, but a groove in someone's memory. Titan has used the same Mozart phrase for thirty years. Britannia's 'ting ting di ting' has survived every rebrand. Before you refresh, modernise or reboot anything, ask who out there can still sing the second line.", "two_sentence_version": "A client sang back the second line of a Nerolac jingle that had been off air for seven years, to complain it was cut. Memory is the brand; edit it with care.", "opening_question": "Which jingle can you still sing, and when did you last hear it?", "rank": 4}], "writing_refs": ["Cite when you need a dated, named Indian example of a social shift (working women, nuclear families, male grooming, kids as mini-adults) rather than a Western one.", "Cite for the thali theory and the sachet/prepaid principle whenever writing about behaviour change or market entry in India.", "Cite the FCB Ulka content analyses (words per ad 41 to 53; saris 65 to 30 per cent; three working women in ninety ads) as rare longitudinal data on Indian advertising.", "Cite the censorship arc (navel at Doordarshan, nikhri for gori, KamaSutra in Parliament, Tuffs' fourteen-year case, ASCI 1985, social media as jury) when writing about regulation, taboo or free expression in Indian media.", "Cite the Last Word's ten mega-trends as a 2015 baseline when assessing how India's consumer economy actually turned out."]}, "big_ideas_why_first": "The whole book rests on it: an ad is a bet on what the audience already believes, so fifty years of ads are a readable record of Indian society.", "concepts_why_first": "The thali theory is the single most portable frame in the book: it explains Indian food marketing and transfers to any behaviour-change talk.", "anecdotes_why_first": "The Prestige cooker story is the book in miniature: one slogan, two eras, the cook changes gender; everyone in an Indian audience knows the line.", "quotes_why_first": "'Jo biwi se kare pyaar' is the line the owner will quote most: instantly recognised, funny in hindsight, and it carries the book's thesis.", "techniques_why_first": "Then-and-now pairing is the book's engine and the easiest technique to lift into any 'how India changed' talk or essay.", "cross_pollination_why_first": "Santosh Desai's Mother Pious Lady is the book's closest sibling and the source of its most reusable idea, the thali theory.", "talk_hooks_why_first": "'One slogan, two cooks' opens any talk on social change with a line the room can finish for you.", "structure": {"spine": "Advertising is a window on a society in transition (Introduction) → read it first through the people it addresses: men, kids, teens, couples, the old, women (Section One) → then through the products that built categories: clothes, food, wheels, homes, rural inputs, mobiles (Section Two) → then through services that reshaped life: weddings and festivals, education, money, travel, jobs, health, cricket (Section Three) → then through the craft of the narrative itself: music, celebrities, Hinglish, censorship (Section Four) → ending with ten mega-trends for a coming consumption era (Last Word).", "parts": [{"name": "Section One: People", "chapters": ["The [In] Complete Man (men)", "I am a Complan Girl! I am a Complan Boy! (kids)", "The Tingling Freshness of Teens (youth)", "Jo Biwi Se Kare Pyaar... (couples)", "Ab Main Bilkul Boodha Hoon (old age)", "Twacha Se Meri Umar Ka Pata Hi Nahi Chalta (women)"], "takeaway": "How each member of the Indian household has been re-cast by ads since the 1960s, and who holds the clinching line in each decade.", "idea_ranks": [1, 2, 3]}, {"name": "Section Two: Products", "chapters": ["Only Vimal (apparel)", "Bachche Toh Bachche, Baap Re Baap! (food)", "Hamara Bajaj, Hamara Bajaj (two-wheelers and cars)", "Ghar Ghar Ki Raunaq Badhani Ho (homes and decor)", "Jai Jawan! Jai Kisan! (rural)", "Har Ek Friend Zaroori Hota Hai (mobiles)"], "takeaway": "How categories were created or converted from commodity to brand, mostly by shrinking the unit of purchase and attacking habits at their margins.", "idea_ranks": [4, 5]}, {"name": "Section Three: Services", "chapters": ["Baraatiyon Ka Swagat (weddings, festivals)", "Tan Ki Shakti, Man Ki Shakti (education, quizzes)", "Zindagi Ke Saath Bhi, Zindagi Ke Baad Bhi! (money)", "God's Own Country (travel)", "Naukri: H for Hitler, A for Arrogant (jobs)", "Kyaa Haal Bana Rakha Hai! (health)", "Asli Swad Hai Cricket Ka (sport)"], "takeaway": "Services that India once treated as taboo, elite or governmental (loans, flying, OTC medicine, job-hopping) became mass aspirations once advertising renamed them.", "idea_ranks": [5, 6]}, {"name": "Section Four: Ad Narratives", "chapters": ["Doodh Doodh Doodh, Wonderful Doodh (music)", "Meri Khubsurti Ka Raaz (celebrities)", "Bole Mere Lips, I Love Uncle Chipps (language, Hinglish)", "No Squeeze, No Wheeze, No Navel Please! (censorship and taboo)"], "takeaway": "The craft side: how jingles, stars, Hinglish and the censors shaped what Indian ads could say, plus the Last Word's ten mega-trends.", "idea_ranks": [7]}]}, "links": {"video": {"url": "https://www.youtube.com/watch?v=ucMPQe9J1E4", "title": "Ambi Parameswaran on Nawabs, Nudes, Noodles (HYBIZ TV interview)", "who": "Ambi Parameswaran (HYBIZTV HD)", "kind": "interview", "minutes": 0}, "review": {"url": "https://www.business-standard.com/article/beyond-business/nude-models-wanted-116062101211_1.html", "outlet": "Business Standard", "title": "Nude models wanted... (Shyamal Majumdar, 21 June 2016)", "gist": "An engaging account of how Indian consumer attitudes changed over fifty years of ads, faulted for repeating well-known campaigns and skipping digital advertising."}}}, {"id": "book-of-elon", "title": "The Book of Elon", "subtitle": "A Guide to Purpose and Success", "author": "Eric Jorgenson", "year": 2026, "pages": 226, "genre": "Curated principles", "accent": "#1F4FD8", "essence": ["Physics is law, everything else is a recommendation: reason from raw materials and physical limits (the 'magic wand number', the 'Idiot Index'), never from what others have done.", "Ideas are trivial, production is excruciating: the factory is the product, manufacturing is the moat, and The Algorithm (question requirements, delete, simplify, accelerate, automate, in that order) is how you build it.", "Pick a mission that is important enough to do even at a 10 percent chance of success, then go ultra-hardcore, sleep on the factory floor, and keep pushing the chips back in."], "tags": ["First Principles", "Engineering", "Execution", "Risk", "Leadership", "Mission"], "big_ideas": [{"title": "Reason from first principles, not analogy", "idea": "Analogy gives slight iterations and gets you through the day; for anything important, break the problem to its physical constituents, price them, and reason upward. The gap between raw-material cost and finished price shows the room for improvement.", "example": "'First-Principles Thinking': batteries were assumed to cost $600/kWh forever; the London Metal Exchange price of cobalt, nickel, aluminium, carbon and a steel can was about $80/kWh. Same move showed rocket materials were 1-2 percent of a rocket's price.", "rank": 1}, {"title": "Simplicity wins, and The Algorithm enforces it", "idea": "'The best part is no part; the best process is no process.' Question requirements (every requirement must have a named human owner), delete (if you are not adding 10 percent back you did not delete enough), simplify, accelerate, automate, strictly in that order.", "example": "'The Algorithm': fiberglass mats on the Model 3 battery pack. Battery team said they were for noise, noise team said fire safety; a microphone test showed no difference; deleting them removed $2 million of robotics.", "rank": 2}, {"title": "Prototypes are easy; production is the real work", "idea": "The eureka myth is false. 'Design is overrated and manufacturing is underrated': 10-100x more effort goes into the production system than the product. The line runs at the speed of the least lucky supplier, so attack the constraint.", "example": "'Attack the Constraint': a shoot-out at the Mexican border delayed trunk carpet; the last American car company to reach volume production without bankruptcy before Tesla was Chrysler in the 1920s.", "rank": 3}, {"title": "Go all in on missions worth losing everything for", "idea": "Musk does not rank opportunities by risk-adjusted return; he picks what must happen for the future to be good, accepts the most likely outcome is failure, and puts his own money in first. Fatalism about the odds dissolves fear.", "example": "'I Expected to Lose Everything' and 'Keeping Tesla Alive': $180M from PayPal became $100M into SpaceX, $70M into Tesla, $10M into SolarCity; by 2008 he was borrowing rent and split his last $30-40M between two dying companies.", "rank": 4}, {"title": "Think in limits", "idea": "Scale any idea to a very large or very small number and see what changes. 'If our volume was a million units a year, would it still be expensive?' If yes, the design, not the volume, is the problem. Also imagine the platonic ideal product and work back to the tools needed.", "example": "'Thinking in Limits': tunnels. Cities are 3D, roads are 2D; shrink a tunnel from 28 feet to 12 feet and cost falls about 4x; tunnel and reinforce continuously for another 2x; LA subway cost a billion dollars per mile.", "rank": 5}, {"title": "Usefulness is measurable: people helped x help per person", "idea": "Musk defines success as total utility, 'almost like the physics definition of true work'. A product that helps a few people a lot equals one that helps millions a little; the question is simply whether what you do is as useful as it could be.", "example": "Part I, 'Be Useful': he wakes up asking 'How can I be useful today?' and tells his children to add more than they take, whether through engineering or writing books.", "rank": 6}, {"title": "Engineering, not science, is the limiting factor of civilisation", "idea": "Science discovers what already exists; engineering creates what never existed and generates the new data physics needs (Galileo's telescope). Wars, too, are decided by technological discontinuity more than by generals.", "example": "'Engineering Wins Wars': Roman martensitic swords versus opponents' blades that 'bend like a noodle'; the Manhattan Project as a creation of the physics community; 'if you can shoot lasers from space... they just got lasered from space.'", "rank": 7}], "concepts": [{"name": "The Algorithm (five steps, in order)", "definition": "1. Make requirements less dumb. 2. Delete the part or process. 3. Simplify or optimise. 4. Accelerate cycle time. 5. Automate. The most common mistake of smart engineers is optimising a thing that should not exist.", "source": "Part II, 'The Algorithm'", "use_when": "Any process-improvement, product or org-design talk; also a self-check before adopting new tools.", "rank": 1}, {"name": "The Idiot Index", "definition": "Ratio of a finished part's cost to the cost of its raw materials. High ratio means the design is too complex or the process inefficient: 'If the ratio is high, you're an idiot.'", "source": "'First-Principles Thinking': a $13,000 half nozzle jacket made of $200 of steel", "use_when": "A memorable metric for any audience on waste, overhead layers, or 'why is this so expensive?'", "rank": 2}, {"name": "The Magic Wand Number", "definition": "The hypothetical cost of a product if you could wave a wand and rearrange its raw materials for free; the theoretical floor that reveals how inefficient current manufacturing is.", "source": "Part I, 'First-Principles Thinking' (rockets at 1-2 percent of market price)", "use_when": "Opening a cost or feasibility discussion: ask what the bill of atoms costs before asking what competitors charge.", "rank": 3}, {"name": "Thinking in Limits", "definition": "Push a variable to an extreme (a million units, zero cost, infinite depth) to separate fundamental constraints from incidental ones; pair with the 'theoretically perfect product' as a moving target.", "source": "Part I, 'Thinking in Limits'", "use_when": "Challenging 'it's always been expensive' or 'it won't scale' objections.", "rank": 4}, {"name": "Ego-to-Ability Ratio", "definition": "When ego exceeds ability you break your feedback loop to reality (your 'RL loop'). Always be smashing your ego; internalise responsibility.", "source": "Part II, 'Frontline Leadership'", "use_when": "Talks on leadership, feedback culture, or why smart people stop learning.", "rank": 5}, {"name": "Shortest-Path Communication (no chain of command)", "definition": "Information travels the shortest path needed to solve the problem; anyone may talk to anyone, and is obliged to until the right thing happens. Managers enforcing chain of command 'will soon find themselves working elsewhere'.", "source": "Part II, 'Remove Organizational Boundaries' (Tesla memo)", "use_when": "Org design, silo-busting, 'you can see the org chart in the product' (the box-in-a-box battery enclosure).", "rank": 6}, {"name": "Sequenced Entry (High Cost, Low Volume First)", "definition": "Enter a new technology at the high-price, low-volume end where early adopters pay for learning, then move down-market with each generation as scale and iteration cut costs (cell phones, flat TVs, Roadster to Model 3).", "source": "Part III, 'Sequenced Strategy of Tesla' and 'Give People More for Less'", "use_when": "Explaining go-to-market for any expensive new technology, or defending premium pricing of a first version.", "rank": 7}, {"name": "Eating Glass and Staring into the Abyss", "definition": "Bill Lee's phrase for founding: eating glass is working on the problems the company needs, not the ones you want; the abyss is constantly facing extinction.", "source": "Part II, 'Eat Glass and Stare into the Abyss'", "use_when": "Setting honest expectations for founders, or explaining why startups feel the way they do.", "rank": 8}, {"name": "Law of Gaseous Expansion for Schedules", "definition": "Work expands to fill whatever time you set and almost never finishes early, so set the most aggressive internal timeline you honestly believe. 'If a timeline is long, it's wrong.'", "source": "Part II, 'Set Aggressive Timelines'", "use_when": "Defending ambitious deadlines, or explaining 'optimistic but delivers'.", "rank": 9}, {"name": "Vector, not Scalar", "definition": "Speed only matters in the right direction; the output of a company is the vector sum of its people, so alignment plus velocity, with guided-missile course corrections, wins.", "source": "Part II, 'Speed Is Both Offense and Defense' and 'Create a Culture of Builders'", "use_when": "Talks on strategy versus hustle; a one-image summary of team alignment.", "rank": 10}], "anecdotes": [{"title": "The battery pack priced at the London Metal Exchange", "story": "Everyone in the early 2000s told Musk cheap electric cars were impossible because battery packs cost $600 per kilowatt-hour and always would. He refused the analogy. What is a battery made of? Cobalt, nickel, aluminium, carbon, some polymer separator, a steel can. What would that pile of material cost if bought on the London Metal Exchange? About $80 per kilowatt-hour. The gap between $80 and $600 was not physics; it was a manufacturing problem waiting for clever people. 'Oh, geez, it's only $80,' he says, and that is how he knew batteries could be far cheaper than anyone realised. He also mocks the horse-era version of the same objection: 'Horses are great... there's lots of grass... people will never buy gas cars.'", "use_as": "opener", "lesson": "Price the atoms, not the precedent.", "rank": 1}, {"title": "The fiberglass mats nobody could explain", "story": "Model 3 production was choking on the battery pack line, and Musk was practically living there. The team first made the robot that laid fiberglass mats on top of the pack faster: 20 percent, then 100 percent. Then they optimised the glue and drying. Still a bottleneck. Finally Musk asked the battery safety team what the mats were for. 'Noise and vibration,' they said. 'But you're the battery team.' So he asked the noise and vibration team. 'Fire safety.' Like a Dilbert cartoon. They put microphones in a car with mats and one without. Nobody could hear a difference. They deleted the mats, which deleted a step that required two million dollars of robots. That failure became the five-step Algorithm: question, delete, simplify, accelerate, automate, in that order.", "use_as": "turning point", "lesson": "Never optimise a thing that should not exist.", "rank": 2}, {"title": "Christmas Eve 2008, 6 p.m.", "story": "In 2008 SpaceX had just failed its third launch, Tesla had a negative gross margin, GM was going bankrupt, Morgan Stanley had reneged on a SolarCity deal, and Musk was going through a divorce while being 'dumped on, massively, in the press'. He had perhaps $30-40 million left. Put it all in one company and the other dies for certain; split it and both might die. 'Which one will I let starve to death? I couldn't bring myself to do it.' He split it. Investors Antonio Gracias, Steve Jurvetson and Aaron Price said they would match whatever he put in, so he put in everything; he had no house and was sleeping in Jeff Skoll's spare bedroom. The Tesla round closed at 6 p.m. on Christmas Eve, the last hour of the last day. Payroll would have bounced two days after Christmas.", "use_as": "turning point", "lesson": "When something is important enough, you do it even when the odds are not in your favour.", "rank": 3}, {"title": "Six weeks, one last rocket", "story": "Musk had budgeted for three Falcon 1 launches; if SpaceX could not reach orbit in three, 'we deserved to die'. In 2006 the first rocket landed in fragments a couple of hundred yards from the pad. The second failed. In 2008 the third failed too. He split his remaining money with Tesla and gathered everyone in a conference room: 'We have one last rocket. Get your shit together, go back to the island, and launch it. You have six weeks.' His email promised, 'I will never give up and I mean never.' Flight four reached orbit; the difference had been a thrust transient invisible on the ground. There was no jubilation, only relief: 'Okay, we're not going to die today.' Weeks later NASA called with a contract. He screamed 'I LOVE NASA. YOU GUYS ROCK' and hung up.", "use_as": "closer", "lesson": "Persistence is a budgeted decision, not a mood.", "rank": 4}, {"title": "Sleeping on the factory floor, where people can see you", "story": "During the Model 3 'production hell' of 2017-2019, Musk lived in the Fremont and Nevada factories for three years. He deliberately did not sleep in a conference room, because nobody would see him there. He slept on the floor outside it. 'Otherwise how would people know? Seeing is believing.' Falling asleep at 4 a.m. on the floor and waking four hours later smelling of oil and iron filings sent one message: if the CEO takes that pain, I can too. He compares it to war: nobody bleeds for the prince in the palace; wherever Napoleon was, his armies fought best. The same logic banned executive parking, offices and separate dining, and requires software managers to spend 20 percent of their time coding.", "use_as": "proof point", "lesson": "Never ask your troops to do something you are not visibly doing yourself.", "rank": 5}, {"title": "The toy-car casting machine", "story": "Tesla wanted to cast the entire front and rear thirds of a car as single pieces, replacing dozens of stamped parts, sealants and rivets. The idea came from toys. 'Toys are cheap! How do they make toys?' 'They just cast them.' 'Can you build a casting machine big enough for a car?' 'No one ever has.' 'Are we breaking any laws of physics?' 'No...' 'Well, let's just ask them.' There were six major casting-machine makers in the world. Five said no. The sixth said maybe. 'I'll take that as a yes.' The rear casting on Model Y cut the body shop by 30 percent and removed 300 robots. Fifty engineers each picking the 'best' metal for their part had produced 'right answers to the wrong questions'.", "use_as": "proof point", "lesson": "If physics permits it, a 'maybe' is a yes.", "rank": 6}, {"title": "The Smart Car that did 0-60 in four seconds", "story": "Daimler executives were on their way to Tesla expecting a PowerPoint. Musk's team instead dropped a Roadster motor and battery pack into a little Smart Car while the Germans were in transit, then handed them the keys. The car hit 60 mph in four seconds. The executives were shocked. Daimler invested $50 million. 'If Daimler had not invested in Tesla at that time, we would have died.' It is the same lesson as his first-prototype advice: anything looks good on PowerPoint, but a physical object people can use, even in primitive form, is what convinces.", "use_as": "proof point", "lesson": "Demonstrate; do not present.", "rank": 7}, {"title": "Starship's wall thickness, asked of the welders", "story": "When deciding how thin Starship's steel tank walls could safely be, Musk did not stop at the executives. He went to the workers doing the welding and asked what they thought was safe. They said 4.8 millimetres. 'What about four?' 'That would make us pretty nervous.' 'Okay, let's try four millimetres.' It worked. He calls this rule 'go as close to the source as pos
