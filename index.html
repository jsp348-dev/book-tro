on Marketing — Philip Kotler", "Never Split the Difference — Chris Voss", "Nudge — Thaler & Sunstein", "Blue Ocean Strategy — Kim & Mauborgne", "This Book Won't Teach You Parenting But Will Make You Better Parents", "At the Helm: A Memoir — V. Krishnamurthy", "The Personal MBA — Josh Kaufman", "Zero to One — Peter Thiel", "How to Talk to Anyone — Leil Lowndes", "Why We Sleep — Matthew Walker", "The Satvic Revolution", "The Simple Path to Wealth — JL Collins", "The 12 Week Year — Brian Moran", "Designing Your Life — Burnett & Evans", "To Sell Is Human — Daniel Pink", "The Kill Chain — Christian Brose", "Bird by Bird — Anne Lamott", "Traction — Gino Wickman", "Thinking Historically — Francis J. Gavin", "Start with Why — Simon Sinek", "Good to Great — Jim Collins", "Range — David Epstein"], "to_read": ["The Happiness Hypothesis — Jonathan Haidt"], "other_lists": [{"name": "McKinsey reading list (July 2026)", "note": "Geopolitics (Thucydides Trap, The Avoidable War, Thinking Historically), business (Schumpeter, Tao of Fundraising, Chung Ju-yung), personal growth (Five Types of Wealth, Jim Collins), biography (Nelson, Lee Kuan Yew)."}, {"name": "COAS Professional Reading List (May 2026)", "note": "Gen Upendra Dwivedi's list in five categories: strategic environment, leadership, military studies, technology, general reading. Kept in the notebook as 22 slide pages."}]}}</script>
<script>
(function(){
const DATA = JSON.parse(document.getElementById('trove-data').textContent);
const BOOKS = DATA.books, BRIDGES = DATA.bridges, NEEDS = DATA.quick_needs, LISTS = DATA.lists||{};
const byId = Object.fromEntries(BOOKS.map(b=>[b.id,b]));
const app = document.getElementById('app');
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const h = (strings,...vals)=>strings.reduce((a,s,i)=>a+s+(i<vals.length?vals[i]:''),'');

const TABS = [
  ['overview','Overview'],['notes','Your notes','yn'],['ideas','Big ideas','big_ideas'],['concepts','Concepts','concepts'],
  ['anecdotes','Anecdotes','anecdotes'],['quotes','Lines & laughs','quotes_and_humour'],
  ['style','How it\'s written'],['infographic','Infographic'],
  ['xpoll','Cross-pollination','cl'],['talk','Talk & writing','cl']
];

/* ---------- routing ---------- */
function route(){
  const hash = (location.hash||'#library').slice(1);
  let m;
  document.querySelectorAll('.nav button').forEach(b=>b.removeAttribute('aria-current'));
  if((m=hash.match(/^book-(.+?)(?:--(\w+))?$/)) && byId[m[1]]){ renderBook(byId[m[1]], m[2]||'overview'); }
  else if(hash==='themes'){ renderThemes(); mark('themes'); }
  else if((m=hash.match(/^finder(?:-(\w+))?$/))){ renderFinder(m[1]||'story'); mark('finder'); }
  else { renderLibrary(); mark('library'); }
  window.scrollTo({top:0,behavior:'instant'});
}
function mark(r){ const b=document.querySelector(`.nav button[data-route="${r}"]`); if(b) b.setAttribute('aria-current','page'); }
function go(hash){ location.hash = hash; }
document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>go(b.dataset.route)));
document.getElementById('brand').addEventListener('click',()=>go('library'));
window.addEventListener('hashchange',route);
app.addEventListener('click',e=>{ const t=e.target.closest('[data-go]'); if(t){ go(t.dataset.go); } });
function setBookColor(b){ document.documentElement.style.setProperty('--book', b?b.accent:'var(--accent)'); document.documentElement.style.setProperty('--book-soft', b?b.accent+'22':'var(--accent-soft)'); }

/* ---------- library ---------- */
function renderLibrary(){
  setBookColor(null);
  const nA = BOOKS.reduce((n,b)=>n+b.anecdotes.length,0), nC=BOOKS.reduce((n,b)=>n+b.concepts.length,0), nQ=BOOKS.reduce((n,b)=>n+b.quotes_and_humour.length,0);
  app.innerHTML = h`
  <section class="hero">
    <div>
      <div class="eyebrow">A commonplace book, kept as dashboards</div>
      <h1>What I'd keep if I <em>forgot the book</em></h1>
      <div class="stats">
        <div class="stat"><b>${BOOKS.length}</b><span>books archived</span></div>
        <div class="stat"><b>${nA}</b><span>retellable anecdotes</span></div>
        <div class="stat"><b>${nC}</b><span>named concepts</span></div>
        <div class="stat"><b>${nQ}</b><span>lines &amp; laughs</span></div>
        <div class="stat"><b>${BRIDGES.length}</b><span>bridges between books</span></div>
        <div class="stat"><b>${BOOKS.reduce((n,b)=>n+(b.your_notes?b.your_notes.decks.reduce((m,d)=>m+d.page_images.length,0):0),0)}</b><span>of your own slides</span></div>
      </div>
    </div>
    <p class="thesis">I will forget the book in some time. If I can retain some themes, concepts, ideas, anecdotes, jokes, writing style, narration technique and infographics, then I can interlink other books and articles for cross-pollination, and use them in my writing and talks.</p>
  </section>

  <section class="section">
    <div class="section-head"><h2>What do I need right now?</h2><span class="muted small">Searches across every book at once</span></div>
    <div class="needs">
      ${NEEDS.map(n=>h`<button class="need" data-go="finder-${n.id}"><i>${esc(n.hint)}</i><b>${esc(n.label)}</b><span>${countFor(n.source)} in the trove</span></button>`).join('')}
    </div>
  </section>

  <section class="section">
    <div class="section-head"><h2>The shelf</h2><span class="muted small">Click a book to open its dashboard</span></div>
    <div class="shelf">
      ${BOOKS.map(b=>h`
      <button class="bookcard" data-go="book-${b.id}" style="--book:${b.accent};--book-soft:${b.accent}22">
        <div class="spine">${esc(b.author)}</div>
        <div class="body">
          <div><h3>${esc(b.title)}</h3><div class="by">${esc(b.subtitle)} · ${b.year}</div></div>
          <p class="ess">${esc(b.essence[0])}</p>
          <div class="chips">${b.tags.map(t=>h`<span class="chip">${esc(t)}</span>`).join('')}</div>
          <div class="counts"><span>${b.big_ideas.length} ideas</span><span>${b.concepts.length} concepts</span><span>${b.anecdotes.length} anecdotes</span><span>${b.quotes_and_humour.length} lines</span></div>
        </div>
      </button>`).join('')}
    </div>
  </section>

  ${LISTS.read_no_notes?h`<section class="section">
    <div class="section-head"><h2>Read, no notes yet</h2><span class="muted small">From your "Books Read" list · ${LISTS.read_no_notes.length} titles waiting for a dashboard</span></div>
    <div class="chips">${LISTS.read_no_notes.map(t=>h`<span class="chip plainchip">${esc(t)}</span>`).join('')}</div>
    <div class="two" style="margin-top:18px">
      <div><div class="eyebrow" style="margin-bottom:6px">To read</div>${LISTS.to_read.map(t=>h`<p>${esc(t)}</p>`).join('')}</div>
      <div><div class="eyebrow" style="margin-bottom:6px">Other lists in the notebook</div>${LISTS.other_lists.map(l=>h`<p class="small"><b>${esc(l.name)}.</b> <span class="muted">${esc(l.note)}</span></p>`).join('')}</div>
    </div>
  </section>`:''}

  <section class="section">
    <div class="section-head"><h2>Bridges between books</h2><span class="muted small">${BRIDGES.length} in all · <button data-go="themes" style="color:var(--accent);font-weight:500;padding:0">see every bridge on the Themes map</button></span></div>
    <div class="hooks">${BRIDGES.slice(0,8).map(bridgeCard).join('')}</div>
  </section>
  ${foot()}`;
}
function countFor(src){ return BOOKS.reduce((n,b)=>n+(src==='techniques'?b.writing_style.techniques.length:b[src].length),0); }
function bridgeCard(br){
  const A=byId[br.a], B=byId[br.b];
  return h`<article class="bridge">
    <div class="pair">
      <button data-go="book-${A.id}"><span class="dot" style="background:${A.accent}"></span>${esc(A.title)}</button>
      <span class="vs">×</span>
      <button data-go="book-${B.id}"><span class="dot" style="background:${B.accent}"></span>${esc(B.title)}</button>
    </div>
    <div><div class="theme-tag">${esc(br.theme)}</div><h3>${esc(br.title)}</h3><p class="prose">${esc(br.text)}</p></div>
  </article>`;
}
function foot(){ return h`<footer><span>Books Insight Trove · built from each book's full text or from your OneNote notes, plus a separately marked layer of commentary.</span><span>Anything marked <span class="cl-badge">Added by Claude</span> is not in the book.</span></footer>`; }

/* ---------- book ---------- */
function renderBook(b, tab){
  setBookColor(b);
  const panel = PANELS[tab] ? PANELS[tab](b) : PANELS.overview(b);
  app.innerHTML = h`
  <div class="crumb" style="padding-top:14px"><button data-go="library">Library</button><span>/</span><span>${esc(b.title)}</span></div>
  <header class="bookhead">
    <div class="meta"><span class="book-badge">${esc(b.genre)}</span><span>${esc(b.author)}</span><span>${b.year}</span>${b.pages?h`<span>${b.pages} pages</span>`:''}</div>
    <h1>${esc(b.title)}<span>${esc(b.subtitle)}</span></h1>
    <div class="essence">${b.essence.map((e,i)=>h`<div><b>Keep ${['one','two','three'][i]}</b>${esc(e)}</div>`).join('')}</div>
    <div class="chips" style="margin-top:14px">${b.tags.map(t=>h`<button class="chip" data-go="themes">${esc(t)}</button>`).join('')}</div>
    <div class="tabs" role="tablist">${TABS.filter(([id])=>id!=='notes'||b.your_notes).map(([id,label,n])=>h`<button role="tab" data-go="book-${b.id}--${id}" aria-selected="${id===tab}" class="${n==='cl'?'cl':n==='yn'?'yn':''}">${label}${n&&n!=='cl'&&n!=='yn'?h`<span>${b[n].length}</span>`:''}</button>`).join('')}</div>
  </header>
  <section class="panel">${panel}</section>
  ${foot()}`;
}
const byRank = arr => [...arr].sort((a,b)=>(a.rank||99)-(b.rank||99));
const whyFirst = (b,key,label)=> b[key] ? h`<p class="why"><b>Why this order.</b> ${esc(b[key])}</p>` : '';
const vizBox = (title,svg,note)=>h`<figure class="viz"><figcaption><span class="eyebrow">Page at a glance</span><b>${esc(title)}</b>${note?h`<span class="muted small">${esc(note)}</span>`:''}</figcaption>${svg}</figure>`;
const rankTag = r => h`<span class="rk">${r}</span>`;

const PANELS = {
  overview(b){
    const li = (arr,f,n=3)=>'<ul>'+byRank(arr).slice(0,n).map(x=>h`<li>${esc(f(x))}</li>`).join('')+'</ul>';
    const tile=(id,title,count,body,cl)=>h`<button class="tile ${cl?'cl':''}" data-go="book-${b.id}--${id}"><div class="th"><h3>${title}</h3><span class="n">${count}</span></div>${body}<span class="go">Open →</span></button>`;
    const L=b.links||{};
    return h`
    ${b.structure?h`<figure class="viz book"><figcaption><span class="eyebrow">The whole book at a glance</span><b>How the argument runs, part by part</b><span class="muted small">${esc(b.structure.spine)}</span></figcaption>${drawBookMap(b)}</figure>`:''}
    <div class="tiles">
      ${tile('ideas','Big ideas',b.big_ideas.length+' ideas',li(b.big_ideas,x=>x.title,4))}
      ${tile('concepts','Concepts & frameworks',b.concepts.length+' named',li(b.concepts,x=>x.name,4))}
      ${tile('anecdotes','Anecdote bank',b.anecdotes.length+' stories',li(b.anecdotes,x=>x.title,4))}
      ${tile('quotes','Lines & laughs',b.quotes_and_humour.length+' lines',li(b.quotes_and_humour,x=>'“'+x.line+'”',3))}
      ${tile('style','How it\'s written',b.writing_style.techniques.length+' techniques',h`<p class="small muted">${esc(b.writing_style.voice)}</p>`)}
      ${tile('infographic','Infographic',b.infographic.type,h`<p class="small muted"><b>${esc(b.infographic.title)}.</b> ${esc(b.infographic.description)}</p>`)}
      ${tile('xpoll','Cross-pollination','<span class="cl-badge">Added by Claude</span>',li(b.claude_layer.cross_pollination,x=>x.with,4),true)}
      ${tile('talk','Talk & writing hooks','<span class="cl-badge">Added by Claude</span>',li(b.claude_layer.talk_hooks,x=>x.title,4),true)}
      ${L.video||L.review?h`<div class="tile links wide"><div class="th"><h3>Hear it, read about it</h3><span class="n">verified links</span></div><div class="linkrow">
        ${L.video&&L.video.url?h`<a class="lk" href="${esc(L.video.url)}" target="_blank" rel="noopener"><span class="lk-k">▶ Watch · ${esc(L.video.kind)}</span><b>${esc(L.video.title)}</b><span class="small muted">${esc(L.video.who)}</span></a>`:''}
        ${L.review&&L.review.url?h`<a class="lk" href="${esc(L.review.url)}" target="_blank" rel="noopener"><span class="lk-k">Read · ${esc(L.review.outlet)}</span><b>${esc(L.review.title)}</b><span class="small muted">${esc(L.review.gist)}</span></a>`:''}
      </div></div>`:''}
      ${b.your_notes?h`<button class="tile yours wide" data-go="book-${b.id}--notes"><div class="th"><h3>Your notes</h3><span class="n">OneNote · ${b.your_notes.highlights.length} highlights · ${b.your_notes.decks.reduce((m,d)=>m+d.page_images.length,0)} slides</span></div><p class="small">${esc(b.your_notes.summary)}</p><div class="thumbs">${b.your_notes.decks.flatMap(d=>d.page_images).slice(0,6).map(src=>h`<img src="${esc(src)}" alt="" loading="lazy">`).join('')}</div><span class="go">Open →</span></button>`:h`<div class="tile yours wide"><div class="th"><h3>Your notes</h3><span class="n">OneNote</span></div><p class="small muted">No notes for this book in your notebook yet. This dashboard was built from the book's full text.</p></div>`}
      ${b.source_note?h`<p class="small muted" style="grid-column:1/-1">${esc(b.source_note)}</p>`:''}
    </div>`;
  },
  notes(b){
    const y=b.your_notes; if(!y) return PANELS.overview(b);
    return h`<div style="display:flex;gap:12px;align-items:center;margin-bottom:6px"><h2 style="margin:0">Your notes</h2><span class="yn-badge">Your own words</span></div>
    <p class="lead">${esc(y.summary)}</p>
    <div class="two">
      <div><h3 style="font-size:22px;margin-bottom:10px">What you captured</h3><ul class="plain yn">${y.highlights.map(x=>h`<li>${esc(x)}</li>`).join('')}</ul></div>
      <div>${y.owner_questions&&y.owner_questions.length?h`<h3 style="font-size:22px;margin-bottom:10px">Questions you asked yourself</h3><div class="hooks">${y.owner_questions.map(q=>h`<p class="oq-card">${esc(q)}</p>`).join('')}</div>`:''}</div>
    </div>
    ${y.decks.filter(d=>d.page_images.length).map(d=>h`<h3 style="font-size:22px;margin:28px 0 12px">${esc(d.title)} <span class="muted small" style="font-family:var(--body);font-weight:400">· ${d.page_images.length} slides</span></h3>
      <div class="gallery">${d.page_images.map(src=>h`<a class="slide" href="${esc(src)}" target="_blank" rel="noopener"><img src="${esc(src)}" alt="${esc(d.title)} slide" loading="lazy"></a>`).join('')}</div>`).join('')}`;
  },
  ideas(b){
    const arr=byRank(b.big_ideas);
    return h`<h2>Big ideas</h2><p class="lead">The handful of themes to carry away, in order of how much of the book rests on each. Every idea has one example so it stays attached to a scene.</p>
    ${vizBox('Ideas ranked by weight',drawPillars(arr,b.accent),'Bar length = how central the idea is to the book')}
    ${whyFirst(b,'big_ideas_why_first')}
    <div class="cards">${arr.map((x,i)=>h`<article class="card">${rankTag(i+1)}<h3>${esc(x.title)}</h3><p>${esc(x.idea)}</p><div class="ex"><b>From the book</b>${esc(x.example)}</div></article>`).join('')}</div>`;
  },
  concepts(b){
    const arr=byRank(b.concepts);
    return h`<h2>Concepts &amp; frameworks</h2><p class="lead">Named things you can define in a sentence and reuse without the book, most useful first.</p>
    ${vizBox('Concept wheel',drawHub(b.title,arr.map(x=>x.name),b.accent),'Clockwise from the top = most to least reusable')}
    ${whyFirst(b,'concepts_why_first')}
    <div class="cards">${arr.map((x,i)=>h`<article class="card">${rankTag(i+1)}<h3>${esc(x.name)}</h3><p>${esc(x.definition)}</p><div class="ex"><b>Use when</b>${esc(x.use_when)}</div><span class="src">${esc(x.source)}</span></article>`).join('')}</div>`;
  },
  anecdotes(b){
    const arr=byRank(b.anecdotes);
    const order=['opener','turning point','proof point','cautionary tale','closer'];
    const uses=[...new Set(arr.map(a=>a.use_as))].sort((x,y)=>order.indexOf(x)-order.indexOf(y));
    return h`<h2>Anecdote bank</h2><p class="lead">Told so they can be retold, best first. The grid shows which story does which job in a talk; filter below it.</p>
    <figure class="viz"><figcaption><span class="eyebrow">Page at a glance</span><b>Which story for which job</b><span class="muted small">Columns follow the arc of a talk: open, turn, prove, warn, close</span></figcaption>
      <div class="matrix" style="--cols:${uses.length}">${uses.map(u=>h`<div class="mcol"><div class="mhead">${esc(u)}<span>${arr.filter(a=>a.use_as===u).length}</span></div>${arr.filter(a=>a.use_as===u).map(a=>h`<button class="mchip" data-f="${esc(u)}" data-filter-click>${rankTag(a.rank)} ${esc(a.title)}</button>`).join('')}</div>`).join('')}</div></figure>
    ${whyFirst(b,'anecdotes_why_first')}
    <div class="filters" id="anec-filters"><button class="chip" aria-pressed="true" data-f="all">All ${arr.length}</button>${uses.map(u=>h`<button class="chip" data-f="${esc(u)}">${esc(u)}</button>`).join('')}</div>
    <div class="anec">${arr.map(a=>h`<article class="card" data-use="${esc(a.use_as)}"><div style="display:flex;gap:10px;align-items:center">${rankTag(a.rank)}<span class="use">${esc(a.use_as)}</span></div><h3>${esc(a.title)}</h3><p class="story">${esc(a.story)}</p><p class="lesson">${esc(a.lesson)}</p></article>`).join('')}</div>`;
  },
  quotes(b){

app.addEventListener('click',e=>{
  const mc=e.target.closest('[data-filter-click]'); if(mc){ const chip=document.querySelector(`#anec-filters .chip[data-f="${mc.dataset.f}"]`); if(chip){ chip.click(); chip.scrollIntoView({behavior:'smooth',block:'center'}); } return; }
  const f=e.target.closest('#anec-filters .chip'); if(!f) return;
  document.querySelectorAll('#anec-filters .chip').forEach(c=>c.setAttribute('aria-pressed','false')); f.setAttribute('aria-pressed','true');
  document.querySelectorAll('[data-use]').forEach(el=>el.hidden = f.dataset.f!=='all' && el.dataset.use!==f.dataset.f);
});

/* ---------- infographics (SVG) ---------- */
function wrapText(s,max){ const w=s.split(' '),lines=[],cur=[]; for(const x of w){ if((cur.join(' ')+' '+x).trim().length>max){lines.push(cur.join(' '));cur.length=0;} cur.push(x);} if(cur.length)lines.push(cur.join(' ')); return lines; }
function drawInfographic(b){
  const ig=b.infographic, acc=b.accent;
  if(ig.type==='timeline') return drawTimeline(ig,acc);
  if(ig.type==='cycle') return drawCycle(ig,acc);
  if(ig.type==='pyramid'||ig.type==='ladder') return drawPyramid(ig,acc);
  if(ig.type==='2x2') return draw2x2(ig,acc);
  if(ig.type==='comparison') return drawComparison(ig,acc);
  return drawRegions(ig,acc);
}
function drawTimeline(ig,acc){
  const items=ig.elements; const rowH=134, W=960, H=items.length*rowH+30;
  let s=h`<svg viewBox="0 0 ${W} ${H}" width="${W}" role="img" aria-label="${esc(ig.title)}" class="b">
  <line x1="120" y1="20" x2="120" y2="${H-10}" style="stroke:var(--line)" stroke-width="2"/>`;
  items.forEach((it,i)=>{
    const y=30+i*rowH; const [head,...rest]=it.label.split(':'); const title=rest.join(':').trim()||head;
    const lines=wrapText(it.detail,96).slice(0,5);
    s+=h`<g>
      <text x="100" y="${y+16}" text-anchor="end" class="m" font-size="15" font-weight="500" fill="${acc}">${esc(it.position_or_order)}</text>
      <circle cx="120" cy="${y+11}" r="7" fill="${acc}"/>
      <text x="142" y="${y+16}" class="d" font-size="19" font-weight="500" style="fill:var(--ink)">${esc(title)}</text>
      ${lines.map((l,j)=>h`<text x="142" y="${y+40+j*18}" font-size="13.5" style="fill:var(--ink-2)">${esc(l)}</text>`).join('')}
    </g>`;
  });
  return s+'</svg>';
}
function drawCycle(ig,acc){
  const steps=ig.elements.filter(e=>/^\d/.test(e.label));
  const hub=ig.elements.find(e=>/centre|center|hub/i.test(e.label+e.position_or_order));
  const wrong=ig.elements.find(e=>/wrong/i.test(e.label));
  const W=1140,H=740,cx=570,cy=350,R=205,n=steps.length;
  let s=h`<svg viewBox="0 0 ${W} ${H}" width="${W}" role="img" aria-label="${esc(ig.title)}" class="b">
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="${acc}"/></marker>
  <marker id="arrw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill:var(--ink-3)"/></marker></defs>
  <circle cx="${cx}" cy="${cy}" r="${R}" fill="none" style="stroke:var(--line)" stroke-width="2"/>`;
  const pos=i=>{const a=-Math.PI/2+i*2*Math.PI/n;return [cx+R*Math.cos(a),cy+R*Math.sin(a),a];};
  for(let i=0;i<n;i++){ const [x1,y1,a1]=pos(i),[x2,y2,a2]=pos((i+1)%n); const am=a1+ (2*Math.PI/n)/2; const a0=a1+0.16,ae=a2-0.16;
    s+=h`<path d="M${cx+R*Math.cos(a0)} ${cy+R*Math.sin(a0)} A${R} ${R} 0 0 1 ${cx+R*Math.cos(ae)} ${cy+R*Math.sin(ae)}" fill="none" stroke="${acc}" stroke-width="2.5" marker-end="url(#arr)"/>`; }
  if(wrong){ const r2=R-60; const a0=-Math.PI/2+2*Math.PI*(n-1)/n-0.35, ae=-Math.PI/2-2*Math.PI+0.35;
    s+=h`<path d="M${cx+r2*Math.cos(a0)} ${cy+r2*Math.sin(a0)} A${r2} ${r2} 0 1 0 ${cx+r2*Math.cos(ae)} ${cy+r2*Math.sin(ae)}" fill="none" style="stroke:var(--ink-3)" stroke-width="1.5" stroke-dasharray="6 6" marker-end="url(#arrw)"/>`; }
  steps.forEach((st,i)=>{ const [x,y]=pos(i); const num=st.label.match(/^\d+/)[0]; const title=st.label.replace(/^\d+\.\s*/,'');
    const right = x>cx+5, left=x<cx-5; const anchor=right?'start':left?'end':'middle'; const tx=right?x+40:left?x-40:x; let ty = y<cy-5? y-44 : y>cy+5 ? y+48 : y;
    const lines=wrapText(st.detail,40).slice(0,5); if(y<cy-5&&!right&&!left) ty = y-48-lines.length*16;
    s+=h`<circle cx="${x}" cy="${y}" r="26" fill="${acc}"/><text x="${x}" y="${y+7}" text-anchor="middle" class="d" font-size="22" font-weight="600" fill="#fff">${num}</text>
    <text x="${tx}" y="${ty}" text-anchor="${anchor}" class="d" font-size="19" font-weight="500" style="fill:var(--ink)">${esc(title)}</text>
    ${lines.map((l,j)=>h`<text x="${tx}" y="${ty+20+j*16}" text-anchor="${anchor}" font-size="12.5" style="fill:var(--ink-2)">${esc(l)}</text>`).join('')}`;
  });
  if(hub){ const lines=wrapText(hub.detail,30).slice(0,5); s+=h`<text x="${cx}" y="${cy-30}" text-anchor="middle" class="m" font-size="11" letter-spacing="1.5" fill="${acc}">THE CENTRE</text>${lines.map((l,j)=>h`<text x="${cx}" y="${cy-8+j*18}" text-anchor="middle" class="d" font-size="15" font-style="italic" style="fill:var(--ink)">${esc(l)}</text>`).join('')}`; }
  if(wrong){ s+=h`<text x="${cx}" y="${H-52}" text-anchor="middle" class="m" font-size="11" letter-spacing="1.5" style="fill:var(--ink-3)">DASHED ARC · THE WRONG WAY ROUND</text>${wrapText(wrong.detail,110).slice(0,2).map((l,j)=>h`<text x="${cx}" y="${H-32+j*16}" text-anchor="middle" font-size="12.5" style="fill:var(--ink-2)">${esc(l)}</text>`).join('')}`; }
  return s+'</svg>';
}

function drawPyramid(ig,acc){
  const tiers=ig.elements.filter(e=>/^\d/.test(e.position_or_order)).sort((a,b)=>parseInt(a.position_or_order)-parseInt(b.position_or_order));
  const extras=ig.elements.filter(e=>!/^\d/.test(e.position_or_order));
  const n=tiers.length, W=960, tH=74, H=n*tH+30, base=700, cx=360;
  let s=h`<svg viewBox="0 0 ${W} ${H}" width="${W}" role="img" aria-label="${esc(ig.title)}">`;
  tiers.forEach((t,i)=>{ const level=n-1-i; const w=base-i*110; const x=cx-w/2; const y=H-20-(i+1)*tH+6;
    const lines=wrapText(t.detail,Math.floor(w/7.2)).slice(0,2);
    s+=h`<rect x="${x}" y="${y}" width="${w}" height="${tH-8}" rx="4" style="fill:${acc}" opacity="${(0.5+0.5*(1-i/n)).toFixed(2)}"/><text x="${cx}" y="${y+22}" text-anchor="middle" class="d" font-size="16" font-weight="600" fill="#fff">${esc(t.label)}</text>${lines.map((l,j)=>h`<text x="${cx}" y="${y+41+j*15}" text-anchor="middle" font-size="12" fill="#fff">${esc(l)}</text>`).join('')}`; });
  extras.forEach((e,k)=>{ const x=cx+base/2+30, y=40+k*120; s+=h`<line x1="${x}" y1="${H-20}" x2="${x}" y2="30" style="stroke:${acc}" stroke-width="2" marker-end="url(#py-arr)"/><defs><marker id="py-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:${acc}"/></marker></defs><text x="${x+14}" y="${y}" class="d" font-size="15" font-weight="500" style="fill:var(--ink)">${esc(e.label)}</text>${wrapText(e.detail,30).slice(0,6).map((l,j)=>h`<text x="${x+14}" y="${y+18+j*15}" font-size="12" style="fill:var(--ink-2)">${esc(l)}</text>`).join('')}`; });
  return s+'</svg>';
}
function draw2x2(ig,acc){
  const q=(re)=>ig.elements.filter(e=>re.test(e.position_or_order+' '+e.detail.slice(0,40)));
  const axes=ig.elements.find(e=>/axes|frame/i.test(e.label+e.position_or_order));
  const quads={tl:q(/top-left|upper[- ]left/i),tr:q(/top-right|upper[- ]right/i),bl:q(/bottom-left|lower[- ]left/i),br:q(/bottom-right|lower[- ]right/i)};
  const used=new Set([axes,...Object.values(quads).flat()]); const notes=ig.elements.filter(e=>!used.has(e));
  const W=960,H=560,gx=120,gy=40,gw=620,gh=440;
  let ax=['',''];
  if(axes){ const m=axes.detail.match(/x\s*=\s*([^;.]+)[;.]\s*y\s*=\s*([^;.]+)/i); if(m) ax=[m[1].trim(),m[2].trim()]; }
  else { const pl=(e)=>(e&&e.position_or_order.replace(/^quadrant:\s*/i,'').split('/').map(t=>t.trim()))||['','']; const l=pl(quads.tl[0]||quads.bl[0]), r=pl(quads.tr[0]||quads.br[0]); if(l[0]&&r[0]) ax=[l[0]+' → '+r[0], (pl(quads.bl[0]||quads.br[0])[1]||'')+' → '+(pl(quads.tl[0]||quads.tr[0])[1]||'')]; }
  let s=h`<svg viewBox="0 0 ${W} ${H}" width="${W}" role="img" aria-label="${esc(ig.title)}">
  <rect x="${gx}" y="${gy}" width="${gw}" height="${gh}" fill="none" style="stroke:var(--line)"/>
  <line x1="${gx+gw/2}" y1="${gy}" x2="${gx+gw/2}" y2="${gy+gh}" style="stroke:var(--line)"/><line x1="${gx}" y1="${gy+gh/2}" x2="${gx+gw}" y2="${gy+gh/2}" style="stroke:var(--line)"/>
  <text x="${gx+gw/2}" y="${gy+gh+28}" text-anchor="middle" class="m" font-size="11" letter-spacing="1" style="fill:var(--ink-3)">${esc((ax[0]||'').toUpperCase())} →</text>
  <text x="${gx-14}" y="${gy+gh/2}" text-anchor="middle" class="m" font-size="11" letter-spacing="1" style="fill:var(--ink-3)" transform="rotate(-90 ${gx-14} ${gy+gh/2})">${esc((ax[1]||'').toUpperCase())} →</text>`;
  const cell={tl:[gx,gy],tr:[gx+gw/2,gy],bl:[gx,gy+gh/2],br:[gx+gw/2,gy+gh/2]};
  for(const k in quads){ const [x,y]=cell[k]; let yy=y+26; quads[k].forEach((e,i)=>{ if(i>2) return; s+=h`<text x="${x+14}" y="${yy}" class="d" font-size="${i?15:19}" font-weight="${i?500:600}" style="fill:${i?'var(--ink)':acc}">${esc(e.label)}</text>`; yy+=20; wrapText(e.detail.replace(/^[^.:]*[:.]\s*/,''),40).slice(0,i?2:4).forEach(l=>{ s+=h`<text x="${x+14}" y="${yy}" font-size="13" style="fill:var(--ink-2)">${esc(l)}</text>`; yy+=16; }); yy+=10; }); }
  let ny=gy+10; notes.forEach(e=>{ s+=h`<text x="${gx+gw+24}" y="${ny}" class="d" font-size="14" font-weight="500" style="fill:${acc}">${esc(e.label)}</text>`; ny+=16; wrapText(e.detail,30).slice(0,4).forEach(l=>{ s+=h`<text x="${gx+gw+24}" y="${ny}" font-size="11.5" style="fill:var(--ink-2)">${esc(l)}</text>`; ny+=13; }); ny+=12; });
  return s+'</svg>';
}
function drawComparison(ig,acc){
  const L=ig.elements.filter(e=>/left/i.test(e.position_or_order)&&!/bottom|under/i.test(e.position_or_order));
  const R=ig.elements.filter(e=>/right/i.test(e.position_or_order)&&!/bottom|under|span/i.test(e.position_or_order));
  const span=ig.elements.filter(e=>/span/i.test(e.position_or_order));
  const foot=ig.elements.filter(e=>/bottom|under/i.test(e.position_or_order));
  const rows=Math.max(L.length,R.length), rowH=92, W=960, H=40+rows*rowH+(span.length?70:0)+(foot.length?80:0);
  const col=(x,w,arr,good)=>arr.map((e,i)=>{const y=40+i*rowH; return h`<rect x="${x}" y="${y}" width="${w}" height="${rowH-10}" rx="4" style="fill:${good?acc:'var(--paper)'};stroke:${acc}" opacity="${good?1:1}"/><text x="${x+14}" y="${y+24}" class="d" font-size="16" font-weight="600" style="fill:${good?'#fff':'var(--ink)'}">${esc(e.label)}</text>${wrapText(e.detail,Math.floor(w/6.8)).slice(0,3).map((l,j)=>h`<text x="${x+14}" y="${y+43+j*14}" font-size="12" style="fill:${good?'#fff':'var(--ink-2)'}">${esc(l)}</text>`).join('')}`;}).join('');
  let s=h`<svg viewBox="0 0 ${W} ${H}" width="${W}" role="img" aria-label="${esc(ig.title)}">
  <text x="20" y="22" class="m" font-size="11" letter-spacing="1.5" style="fill:${acc}">GOOD</text><text x="500" y="22" class="m" font-size="11" letter-spacing="1.5" style="fill:var(--ink-3)">BAD</text>
  ${col(20,440,L,true)}${col(500,440,R,false)}`;
  let y=40+rows*rowH;
  span.forEach(e=>{ s+=h`<rect x="500" y="${y}" width="440" height="56" rx="4" fill="none" style="stroke:var(--ink-3)" stroke-dasharray="4 4"/><text x="514" y="${y+22}" class="d" font-size="15" font-weight="600" style="fill:var(--ink)">${esc(e.label)}</text>${wrapText(e.detail,64).slice(0,2).map((l,j)=>h`<text x="514" y="${y+39+j*13}" font-size="11.5" style="fill:var(--ink-2)">${esc(l)}</text>`).join('')}`; y+=70; });
  foot.forEach(e=>{ const left=/left/i.test(e.position_or_order); const x=left?20:500; s+=h`<text x="${x}" y="${y+16}" class="d" font-size="14" font-weight="500" style="fill:${acc}">${esc(e.label)}</text>${wrapText(e.detail,64).slice(0,3).map((l,j)=>h`<text x="${x}" y="${y+34+j*13}" font-size="11.5" style="fill:var(--ink-2)">${esc(l)}</text>`).join('')}`; });
  return s+'</svg>';
}
function drawRegions(ig,acc){
  return h`<div class="regions">${ig.elements.map((e,i)=>h`<div class="region"><span class="eyebrow">${esc(e.position_or_order)}</span><b>${esc(e.label)}</b><p>${esc(e.detail)}</p></div>`).join('')}</div>`;
}

function drawList(ig,acc){ return '<ol>'+ig.elements.map(e=>h`<li><b>${esc(e.label)}</b> — ${esc(e.detail)}</li>`).join('')+'</ol>'; }

/* ---------- themes ---------- */
function renderThemes(){
  setBookColor(null);
  const tags={}; BOOKS.forEach(b=>b.tags.forEach(t=>{(tags[t]=tags[t]||[]).push(b);}));
  const sorted=Object.entries(tags).sort((a,b)=>b[1].length-a[1].length||a[0].localeCompare(b[0]));
  app.innerHTML=h`
  <section class="section" style="padding-top:36px">
    <div class="section-head"><div><div class="eyebrow">Themes map</div><h2 style="font-size:34px;margin-top:4px">Ideas in the centre, books around them</h2></div><span class="muted small">Shared themes are where cross-pollination starts</span></div>
    <div class="themes">${sorted.map(([t,bs])=>h`<article class="theme"><h3>${esc(t)}</h3><div class="bk">${bs.map(b=>h`<button data-go="book-${b.id}"><span class="dot" style="background:${b.accent}"></span>${esc(b.title)}</button>`).join('')}</div></article>`).join('')}</div>
  </section>
  <section class="section">
    <div class="section-head"><h2>Bridges between books</h2><span class="cl-badge">Added by Claude</span></div>
    <div class="hooks">${BRIDGES.map(bridgeCard).join('')}</div>
  </section>
  <section class="section">
    <div class="section-head"><h2>Concepts, side by side</h2><span class="muted small">Every named framework in the trove</span></div>
    <div class="cards">${BOOKS.flatMap(b=>b.concepts.map(c=>h`<article class="card" style="--book:${b.accent}"><span class="src" style="color:${b.accent}">${esc(b.title)}</span><h3>${esc(c.name)}</h3><p class="small">${esc(c.definition)}</p></article>`)).join('')}</div>
  </section>
  ${foot()}`;
}

/* ---------- finder ---------- */
function renderFinder(kind){
  setBookColor(null);
  const need=NEEDS.find(n=>n.id===kind)||NEEDS[0];
  const rows=BOOKS.flatMap(b=>{
    if(need.source==='anecdotes') return b.anecdotes.map(a=>({b,t:a.title,p:a.story,s:a.use_as}));
    if(need.source==='concepts') return b.concepts.map(c=>({b,t:c.name,p:c.definition,s:c.use_when}));
    if(need.source==='quotes_and_humour') return b.quotes_and_humour.map(q=>({b,t:'“'+q.line+'”',p:q.context,s:q.who+' · '+q.type}));
    return b.writing_style.techniques.map(t=>({b,t:t.technique,p:t.steal_it,s:t.how_it_works}));
  });
  app.innerHTML=h`
  <section class="section" style="padding-top:36px">
    <div class="finder-head"><h2>Finder</h2><div class="filters" style="margin:0">${NEEDS.map(n=>h`<button class="chip" aria-pressed="${n.id===need.id}" data-go="finder-${n.id}">${esc(n.label)}</button>`).join('')}</div></div>
    <p class="lead muted" style="margin-bottom:18px">${rows.length} results across ${BOOKS.length} books. ${esc(need.hint)}.</p>
    <div class="cards">${rows.map(r=>h`<article class="fr"><div class="from"><span class="dot" style="background:${r.b.accent}"></span><button data-go="book-${r.b.id}">${esc(r.b.title)}</button></div><h3>${esc(r.t)}</h3><p>${esc(r.p)}</p><span class="eyebrow" style="text-transform:none;letter-spacing:0">${esc(r.s)}</span></article>`).join('')}</div>
  </section>
  ${foot()}`;
}

route();
})();
